<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainbow Fish Catcher 🎣</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d47a1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas { display: block; }
    #back-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 100;
      background: #e91e8c;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 50px;
      padding: 8px 18px;
      font-family: 'Fredoka One', cursive;
      font-size: 18px;
      text-decoration: none;
      box-shadow: 0 4px 0 #880e4f;
      transition: top 0.08s, box-shadow 0.08s;
      user-select: none;
    }
    #back-btn:active { top: 17px; box-shadow: 0 1px 0 #880e4f; }
  </style>
</head>
<body>
<a href="/index.html" id="back-btn">🏠 Games</a>
<script src="/kaylee-game-pack/pr-preview/pr-7/lib/phaser.min.js"></script>
<script>
'use strict';

const W = 800, H = 600;
const WATER_Y    = 225;   // water surface Y
const DOCK_LEFT  = 220;
const DOCK_RIGHT = 510;
const DOCK_TOP   = 190;
const DOCK_BOT   = 232;

// Rod tip — where the fishing line leaves the fisherman's rod
const ROD_X = 468;
const ROD_Y = 148;

const MAX_HOOK_Y = 575;
const LINE_SPEED = 260;   // px per second

const WIN_COUNT = 10;

const PACK1 = '../../packs/craftpix-net-258377-free-fishing-game-assets-pixel-art-pack/';
const PACK2 = '../../packs/2d-pixel-fishing-village-pack-dock-interior-boats-npcs/PNG/Fish/';

// Fish definitions ─────────────────────────────────────────────────────────────
// frameW/H: size of each animation frame in the sprite sheet
// scale: render scale (pixel art → game pixels)
// depth zones: Y offset from water surface (shallow → deep)
const FISH_DEFS = [
  { key:'fish1', frameW:32, frameH:32, count:9, scale:3.0, pts:1, stars:'⭐',    depMin:25,  depMax:110, spdMin:80,  spdMax:130 },
  { key:'fish2', frameW:32, frameH:32, count:9, scale:3.0, pts:1, stars:'⭐',    depMin:80,  depMax:180, spdMin:90,  spdMax:140 },
  { key:'fish3', frameW:48, frameH:32, count:9, scale:2.8, pts:2, stars:'⭐⭐',   depMin:155, depMax:280, spdMin:50,  spdMax:85  },
  { key:'fish4', frameW:48, frameH:32, count:9, scale:2.8, pts:3, stars:'⭐⭐⭐',  depMin:210, depMax:340, spdMin:38,  spdMax:68  },
];

// ─────────────────────────────────────────────────────────────────────────────
class FishCatcherScene extends Phaser.Scene {
  constructor() { super('FishCatcher'); }

  // ── preload ────────────────────────────────────────────────────────────────
  preload() {
    // Fisherman
    this.load.spritesheet('f_idle', PACK1 + '1 Fisherman/Fisherman_idle.png', { frameWidth:48, frameHeight:48 });
    this.load.spritesheet('f_fish', PACK1 + '1 Fisherman/Fisherman_fish.png', { frameWidth:48, frameHeight:48 });
    this.load.spritesheet('f_hook', PACK1 + '1 Fisherman/Fisherman_hook.png', { frameWidth:48, frameHeight:48 });
    // Fish
    this.load.spritesheet('fish1', PACK2 + 'Fish1_animation.png', { frameWidth:32, frameHeight:32 });
    this.load.spritesheet('fish2', PACK2 + 'Fish2_animation.png', { frameWidth:32, frameHeight:32 });
    this.load.spritesheet('fish3', PACK2 + 'Fish3_animation.png', { frameWidth:48, frameHeight:32 });
    this.load.spritesheet('fish4', PACK2 + 'Fish4_animation.png', { frameWidth:48, frameHeight:32 });
  }

  // ── create ─────────────────────────────────────────────────────────────────
  create() {
    this.fishCount  = 0;
    this.gameOver   = false;
    this.lineActive = false;
    this.lineDir    = 0;   // 0=idle, 1=going down, -1=going up
    this.hookY      = ROD_Y;
    this.pool       = [];  // active fish sprites
    this.retractCb  = null;

    this._buildBackground();
    this._buildAnims();
    this._buildFisherman();
    this._buildUI();
    this._startSpawning();

    this.lineGfx = this.add.graphics().setDepth(6);
    this.input.on('pointerdown', this._onTap, this);
  }

  // ── update ─────────────────────────────────────────────────────────────────
  update(_t, delta) {
    if (this.gameOver) return;
    const dt = delta / 1000;
    this._updateLine(dt);
    this._updateFish(dt);
  }

  // ══════════════════════════════════════════════════════════════════════════
  // BACKGROUND
  // ══════════════════════════════════════════════════════════════════════════
  _buildBackground() {
    // Sky
    const sky = this.add.graphics();
    sky.fillGradientStyle(0x87CEEB, 0x87CEEB, 0x42A5F5, 0x42A5F5, 1);
    sky.fillRect(0, 0, W, WATER_Y);

    // Sun + glow
    const sun = this.add.graphics();
    sun.fillStyle(0xFFF176, 0.4);
    sun.fillCircle(695, 58, 62);
    sun.fillStyle(0xFFD54F, 1);
    sun.fillCircle(695, 58, 44);

    // Clouds
    this._drawCloud(110, 55, 1.1);
    this._drawCloud(360, 38, 1.4);
    this._drawCloud(580, 72, 0.9);

    // Dock surface
    const dock = this.add.graphics().setDepth(3);
    dock.fillStyle(0x8D6E63, 1);
    dock.fillRect(DOCK_LEFT, DOCK_TOP, DOCK_RIGHT - DOCK_LEFT, DOCK_BOT - DOCK_TOP);
    // plank lines
    dock.lineStyle(3, 0x6D4C41, 0.7);
    for (let x = DOCK_LEFT + 34; x < DOCK_RIGHT; x += 34) {
      dock.beginPath();
      dock.moveTo(x, DOCK_TOP);
      dock.lineTo(x, DOCK_BOT);
      dock.strokePath();
    }
    // edge highlight
    dock.lineStyle(2, 0xA1887F, 0.5);
    dock.beginPath();
    dock.moveTo(DOCK_LEFT, DOCK_TOP);
    dock.lineTo(DOCK_RIGHT, DOCK_TOP);
    dock.strokePath();

    // Dock pillars
    const pil = this.add.graphics().setDepth(2);
    pil.fillStyle(0x5D4037, 1);
    [295, 360, 430, 498].forEach(px => {
      pil.fillRect(px - 9, DOCK_BOT, 18, 70);
      // pillar cross-beam
      pil.fillStyle(0x4E342E, 1);
      pil.fillRect(px - 12, DOCK_BOT + 45, 24, 8);
      pil.fillStyle(0x5D4037, 1);
    });

    // Railing posts on dock (left side)
    pil.fillStyle(0x795548, 1);
    [240, 280, 320].forEach(px => {
      pil.fillRect(px - 3, DOCK_TOP - 28, 6, 32);
    });
    // Railing top
    pil.lineStyle(5, 0x795548, 1);
    pil.beginPath();
    pil.moveTo(237, DOCK_TOP - 27);
    pil.lineTo(323, DOCK_TOP - 27);
    pil.strokePath();

    // Water body
    const water = this.add.graphics().setDepth(1);
    water.fillStyle(0x1565C0, 1);
    water.fillRect(0, WATER_Y, W, H - WATER_Y);

    // Surface shimmer strips
    water.fillStyle(0x64B5F6, 0.35);
    for (let i = 0; i < 14; i++) {
      water.fillRect(i * 60 - 15, WATER_Y + 6, 42, 9);
    }

    // Mid-depth darkening
    water.fillStyle(0x0D47A1, 0.5);
    water.fillRect(0, WATER_Y + 190, W, H - WATER_Y - 190);

    // Deep band
    water.fillStyle(0x0A237A, 0.5);
    water.fillRect(0, WATER_Y + 330, W, H - WATER_Y - 330);

    // Seaweed
    const sw = this.add.graphics().setDepth(2);
    sw.fillStyle(0x2E7D32, 0.75);
    [[70, H-50, 10, 55], [160, H-70, 10, 72], [310, H-45, 8, 48],
     [570, H-65, 10, 68], [680, H-52, 10, 55], [760, H-80, 10, 82]].forEach(([x,y,w,h])=>{
      sw.fillRect(x, y, w, h);
      sw.fillEllipse(x+5, y, w+8, w+6);  // leaf top
    });

    // Rocks
    sw.fillStyle(0x546E7A, 0.8);
    [[50,H-10,44,18],[140,H-8,32,14],[590,H-12,48,20],[730,H-9,38,16]].forEach(([x,y,w,h])=>{
      sw.fillEllipse(x, y, w, h);
    });

    // Bubbles (decorative, static)
    sw.fillStyle(0x90CAF9, 0.35);
    [[100,H-100],[250,H-140],[450,H-110],[620,H-155],[720,H-120]].forEach(([x,y])=>{
      sw.fillCircle(x, y, 5);
      sw.fillCircle(x-12, y-18, 4);
      sw.fillCircle(x+8, y-30, 3);
    });
  }

  _drawCloud(cx, cy, s) {
    const g = this.add.graphics();
    g.fillStyle(0xFFFFFF, 0.88);
    const r = s * 28;
    g.fillEllipse(cx,      cy,      r * 3.2, r * 1.2);
    g.fillEllipse(cx - r,  cy + 5,  r * 2.2, r);
    g.fillEllipse(cx + r,  cy + 4,  r * 2,   r * 0.9);
    g.fillEllipse(cx - r*0.3, cy - r*0.5, r * 2, r * 1.1);
  }

  // ══════════════════════════════════════════════════════════════════════════
  // ANIMATIONS
  // ══════════════════════════════════════════════════════════════════════════
  _buildAnims() {
    this.anims.create({ key:'idle', frames: this.anims.generateFrameNumbers('f_idle', { start:0, end:3 }), frameRate:7, repeat:-1 });
    this.anims.create({ key:'fish', frames: this.anims.generateFrameNumbers('f_fish', { start:0, end:3 }), frameRate:8, repeat:-1 });
    this.anims.create({ key:'hook', frames: this.anims.generateFrameNumbers('f_hook', { start:0, end:5 }), frameRate:10, repeat:0 });

    FISH_DEFS.forEach(fd => {
      this.anims.create({
        key: 'swim_' + fd.key,
        frames: this.anims.generateFrameNumbers(fd.key, { start:0, end: fd.count - 1 }),
        frameRate: 11,
        repeat: -1
      });
    });
  }

  // ══════════════════════════════════════════════════════════════════════════
  // FISHERMAN
  // ══════════════════════════════════════════════════════════════════════════
  _buildFisherman() {
    // Positioned on the dock; origin (0.5, 1) so y = feet
    this.fisherman = this.add.sprite(400, DOCK_TOP + 2, 'f_idle')
      .setScale(2.5)
      .setOrigin(0.5, 1)
      .setDepth(5);
    this.fisherman.play('idle');
  }

  // ══════════════════════════════════════════════════════════════════════════
  // UI
  // ══════════════════════════════════════════════════════════════════════════
  _buildUI() {
    // Score panel background
    const panel = this.add.graphics().setDepth(10);
    panel.fillStyle(0x4A148C, 0.82);
    panel.fillRoundedRect(8, 8, 200, 52, 16);
    panel.lineStyle(3, 0xCE93D8, 1);
    panel.strokeRoundedRect(8, 8, 200, 52, 16);

    this.scoreText = this.add.text(108, 34, '🐟 0 / 10', {
      fontFamily: '"Fredoka One", cursive',
      fontSize: '28px',
      color: '#ffffff',
      stroke: '#7B1FA2',
      strokeThickness: 4
    }).setOrigin(0.5).setDepth(11);

    // Hint text
    this.hintText = this.add.text(W / 2, H - 28, '🖱️  Tap anywhere to cast!', {
      fontFamily: '"Fredoka One", cursive',
      fontSize: '24px',
      color: '#FFF9C4',
      stroke: '#5D4037',
      strokeThickness: 4
    }).setOrigin(0.5).setDepth(10);

    // Animated hint arrow pointing up
    this.hintArrow = this.add.text(W / 2, H - 58, '⬆', {
      fontFamily: '"Fredoka One", cursive',
      fontSize: '22px',
      color: '#FFF9C4',
    }).setOrigin(0.5).setDepth(10);
    this.tweens.add({
      targets: this.hintArrow,
      y: H - 68,
      duration: 700,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.InOut'
    });
  }

  _updateScore() {
    this.scoreText.setText('🐟 ' + this.fishCount + ' / ' + WIN_COUNT);
    // Bounce the text briefly
    this.tweens.add({
      targets: this.scoreText,
      scaleX: 1.3,
      scaleY: 1.3,
      duration: 120,
      yoyo: true,
      ease: 'Back.Out'
    });
  }

  // ══════════════════════════════════════════════════════════════════════════
  // FISH SPAWNING
  // ══════════════════════════════════════════════════════════════════════════
  _startSpawning() {
    // Stagger initial fish
    for (let i = 0; i < 6; i++) {
      this.time.delayedCall(i * 450, this._spawnFish, [], this);
    }
    this.spawnEvent = this.time.addEvent({
      delay: 1800,
      callback: this._spawnFish,
      callbackScope: this,
      loop: true
    });
  }

  _spawnFish() {
    if (this.gameOver) return;
    if (this.pool.length >= 10) return;

    const fd   = Phaser.Utils.Array.GetRandom(FISH_DEFS);
    const goR  = Phaser.Math.Between(0, 1) === 0;  // go right?
    const depth= Phaser.Math.Between(fd.depMin, fd.depMax);
    const y    = WATER_Y + depth;
    if (y > H - 20) return;

    const speed = Phaser.Math.Between(fd.spdMin, fd.spdMax);
    const startX = goR ? -80 : W + 80;

    const fish = this.add.sprite(startX, y, fd.key)
      .setScale(fd.scale)
      .setDepth(4);

    // Fish sprites face left by default; flip if going right
    fish.setFlipX(goR);
    fish.play('swim_' + fd.key);

    fish._fd     = fd;
    fish._speed  = speed;
    fish._dir    = goR ? 1 : -1;
    fish._caught = false;
    fish._hitHW  = (fd.frameW * fd.scale) * 0.5;   // half-width hitbox
    fish._hitHH  = (fd.frameH * fd.scale) * 0.45;  // half-height hitbox

    this.pool.push(fish);
  }

  // ══════════════════════════════════════════════════════════════════════════
  // LINE / CASTING
  // ══════════════════════════════════════════════════════════════════════════
  _onTap() {
    if (this.lineActive || this.gameOver) return;
    this._cast();
  }

  _cast() {
    this.lineActive = true;
    this.lineDir    = 1;
    this.hookY      = ROD_Y;

    this.fisherman.play('fish');
    this.hintText.setVisible(false);
    this.hintArrow.setVisible(false);

    // Water ripple at rod tip when cast
    this._ripple(ROD_X, WATER_Y);

    // Auto-retract after 2.1 s if no catch
    this.retractCb = this.time.delayedCall(2100, () => {
      if (this.lineDir === 1) this.lineDir = -1;
    });
  }

  _retract() {
    this.lineDir = -1;
    if (this.retractCb) { this.retractCb.remove(false); this.retractCb = null; }
  }

  _updateLine(dt) {
    if (!this.lineActive) {
      this.lineGfx.clear();
      return;
    }

    if (this.lineDir === 1) {
      this.hookY += LINE_SPEED * dt;
      if (this.hookY >= MAX_HOOK_Y) {
        this.hookY = MAX_HOOK_Y;
        this.lineDir = -1;
      } else {
        this._checkCatch();
      }
    } else if (this.lineDir === -1) {
      this.hookY -= LINE_SPEED * dt;
      if (this.hookY <= ROD_Y) {
        this.hookY = ROD_Y;
        this.lineActive = false;
        this.lineDir    = 0;
        this.lineGfx.clear();
        if (!this.gameOver) {
          const anim = this.fisherman.anims.currentAnim;
          if (!anim || anim.key !== 'hook') this.fisherman.play('idle');
          this.hintText.setVisible(true);
          this.hintArrow.setVisible(true);
        }
        return;
      }
    }

    // Draw line
    this.lineGfx.clear();
    // Line body
    this.lineGfx.lineStyle(2, 0xE0E0E0, 0.9);
    this.lineGfx.beginPath();
    this.lineGfx.moveTo(ROD_X, ROD_Y);
    this.lineGfx.lineTo(ROD_X, this.hookY);
    this.lineGfx.strokePath();
    // Hook circle
    this.lineGfx.fillStyle(0xBDBDBD, 1);
    this.lineGfx.fillCircle(ROD_X, this.hookY, 5);
    // Small hook curve
    this.lineGfx.lineStyle(2, 0x9E9E9E, 1);
    this.lineGfx.beginPath();
    this.lineGfx.arc(ROD_X + 4, this.hookY, 5, Phaser.Math.DegToRad(90), Phaser.Math.DegToRad(270), false);
    this.lineGfx.strokePath();
  }

  _checkCatch() {
    for (let i = this.pool.length - 1; i >= 0; i--) {
      const fish = this.pool[i];
      if (!fish || !fish.active || fish._caught) continue;
      const dx = Math.abs(ROD_X - fish.x);
      const dy = Math.abs(this.hookY - fish.y);
      if (dx < fish._hitHW && dy < fish._hitHH) {
        this._catchFish(fish, i);
        return;
      }
    }
  }

  _catchFish(fish, idx) {
    fish._caught = true;
    this.pool.splice(idx, 1);

    // Retract line immediately
    this._retract();

    // Fisherman hook animation
    this.fisherman.play('hook').once('animationcomplete', () => {
      if (this.lineActive) {
        this.fisherman.play('fish');
      } else {
        if (!this.gameOver) this.fisherman.play('idle');
      }
    });

    // Water splash where line enters water
    this._ripple(ROD_X, WATER_Y);

    // Tween fish up along the line to the rod tip
    fish.stop();
    this.tweens.add({
      targets: fish,
      x: ROD_X,
      y: ROD_Y,
      scaleX: fish.scaleX * 0.65,
      scaleY: fish.scaleY * 0.65,
      angle: -30,
      duration: 480,
      ease: 'Cubic.Out',
      onComplete: () => {
        this._showCelebration(ROD_X, ROD_Y - 10, fish._fd);
        fish.destroy();
      }
    });

    // Update score
    this.fishCount++;
    this._updateScore();

    if (this.fishCount >= WIN_COUNT) {
      this.time.delayedCall(900, this._showWin, [], this);
    }
  }

  // ══════════════════════════════════════════════════════════════════════════
  // FISH MOVEMENT
  // ══════════════════════════════════════════════════════════════════════════
  _updateFish(dt) {
    for (let i = this.pool.length - 1; i >= 0; i--) {
      const fish = this.pool[i];
      if (!fish || !fish.active || fish._caught) continue;
      fish.x += fish._speed * fish._dir * dt;
      // Cull if off-screen
      if ((fish._dir === 1 && fish.x > W + 100) ||
          (fish._dir === -1 && fish.x < -100)) {
        fish.destroy();
        this.pool.splice(i, 1);
      }
    }
  }

  // ══════════════════════════════════════════════════════════════════════════
  // EFFECTS
  // ══════════════════════════════════════════════════════════════════════════
  _ripple(x, y) {
    const g = this.add.graphics().setDepth(7);
    g.lineStyle(2, 0x90CAF9, 0.8);
    g.strokeCircle(x, y, 6);
    this.tweens.add({
      targets: g,
      scaleX: 3, scaleY: 1.2,
      alpha: 0,
      duration: 500,
      ease: 'Power2',
      onComplete: () => g.destroy()
    });
  }

  _showCelebration(x, y, fd) {
    // Stars popup
    const stars = this.add.text(x, y, fd.stars, {
      fontFamily: '"Fredoka One", cursive',
      fontSize: '42px'
    }).setOrigin(0.5).setDepth(20);
    this.tweens.add({
      targets: stars,
      y: y - 90,
      alpha: 0,
      scaleX: 1.5, scaleY: 1.5,
      duration: 1200,
      ease: 'Power2',
      onComplete: () => stars.destroy()
    });

    // Cheer message
    const msgs = ['Nice catch! 🎉', 'Woohoo! 🌟', 'Amazing! ✨', 'Got one! 🐟', 'Great job! 💫'];
    const msg = this.add.text(x, y - 40, Phaser.Utils.Array.GetRandom(msgs), {
      fontFamily: '"Fredoka One", cursive',
      fontSize: '26px',
      color: '#FFF176',
      stroke: '#E65100',
      strokeThickness: 4
    }).setOrigin(0.5).setDepth(20);
    this.tweens.add({
      targets: msg,
      y: y - 110,
      alpha: 0,
      duration: 1400,
      ease: 'Power2',
      onComplete: () => msg.destroy()
    });

    // Particle burst
    const COLS = [0xFF6B6B, 0xFFD93D, 0x69DB7C, 0x74C0FC, 0xFF922B, 0xF783AC, 0xCE93D8];
    for (let i = 0; i < 14; i++) {
      const ang = (i / 14) * Math.PI * 2;
      const dist = Phaser.Math.Between(55, 110);
      const c = this.add.circle(x, y, Phaser.Math.Between(5, 9), COLS[i % COLS.length]).setDepth(20);
      this.tweens.add({
        targets: c,
        x: x + Math.cos(ang) * dist,
        y: y + Math.sin(ang) * dist,
        alpha: 0,
        scaleX: 0.1, scaleY: 0.1,
        duration: Phaser.Math.Between(650, 950),
        ease: 'Power2',
        onComplete: () => c.destroy()
      });
    }
  }

  // ══════════════════════════════════════════════════════════════════════════
  // WIN SCREEN
  // ══════════════════════════════════════════════════════════════════════════
  _showWin() {
    this.gameOver = true;
    this.lineActive = false;
    this.lineGfx.clear();
    if (this.spawnEvent) this.spawnEvent.remove(false);

    // Freeze fisherman in happy pose
    this.fisherman.play('idle');

    // Dark overlay
    const ov = this.add.graphics().setDepth(30);
    ov.fillStyle(0x000000, 0.55);
    ov.fillRect(0, 0, W, H);

    // Panel
    const px = W / 2, py = H / 2;
    const panel = this.add.graphics().setDepth(31);
    panel.fillStyle(0x6A1B9A, 1);
    panel.fillRoundedRect(px - 300, py - 200, 600, 400, 32);
    panel.fillStyle(0xAB47BC, 1);
    panel.fillRoundedRect(px - 290, py - 190, 580, 380, 28);

    // Stars decoration
    this.add.text(px, py - 155, '🌟 🐟 🌟', {
      fontFamily: '"Fredoka One", cursive',
      fontSize: '44px'
    }).setOrigin(0.5).setDepth(32);

    this.add.text(px, py - 80, 'You caught 10 fish,', {
      fontFamily: '"Fredoka One", cursive',
      fontSize: '38px',
      color: '#4A148C',
      stroke: '#ffffff',
      strokeThickness: 3
    }).setOrigin(0.5).setDepth(32);

    this.add.text(px, py - 28, 'Kaylee! 🎉', {
      fontFamily: '"Fredoka One", cursive',
      fontSize: '44px',
      color: '#4A148C',
      stroke: '#ffffff',
      strokeThickness: 4
    }).setOrigin(0.5).setDepth(32);

    this.add.text(px, py + 32, "You're a super fisher! 🎣", {
      fontFamily: '"Fredoka One", cursive',
      fontSize: '28px',
      color: '#311B92',
      stroke: '#EDE7F6',
      strokeThickness: 3
    }).setOrigin(0.5).setDepth(32);

    // Play again button
    const btn = this.add.text(px, py + 110, '🎣  Play Again!', {
      fontFamily: '"Fredoka One", cursive',
      fontSize: '34px',
      color: '#ffffff',
      backgroundColor: '#E91E8C',
      padding: { x: 28, y: 14 }
    }).setOrigin(0.5).setDepth(32).setInteractive({ useHandCursor: true });

    btn.on('pointerover',  () => btn.setScale(1.06));
    btn.on('pointerout',   () => btn.setScale(1));
    btn.on('pointerdown',  () => this.scene.restart());

    this._launchConfetti();
  }

  _launchConfetti() {
    const COLS = [0xFF6B6B, 0xFFD93D, 0x69DB7C, 0x74C0FC, 0xFF922B, 0xF783AC, 0xCE93D8, 0xFFFFFF];
    const burst = (delay) => {
      for (let i = 0; i < 40; i++) {
        this.time.delayedCall(delay + i * 40, () => {
          const x = Phaser.Math.Between(30, W - 30);
          const r = this.add.rectangle(x, -15,
            Phaser.Math.Between(8, 18),
            Phaser.Math.Between(8, 18),
            COLS[Phaser.Math.Between(0, COLS.length - 1)]
          ).setDepth(35);
          this.tweens.add({
            targets: r,
            y: H + 30,
            x: x + Phaser.Math.Between(-90, 90),
            angle: Phaser.Math.Between(-200, 200),
            duration: Phaser.Math.Between(1800, 3500),
            ease: 'Linear',
            onComplete: () => r.destroy()
          });
        });
      }
    };
    burst(0);
    burst(1400);
    burst(2800);
    burst(4200);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
new Phaser.Game({
  type: Phaser.AUTO,
  width: W,
  height: H,
  backgroundColor: '#1565C0',
  scene: FishCatcherScene,
  parent: document.body,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  }
});
</script>
</body>
</html>
