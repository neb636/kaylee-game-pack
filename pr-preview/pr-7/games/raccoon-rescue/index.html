<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Raccoon Rescue Bubble Blast</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a0533;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>
<script src="/kaylee-game-pack/pr-preview/pr-7/lib/phaser.min.js"></script>
<script>
const PACK = '../../packs/craftpix-net-685682-raccon-rescue-bubble-shooter-game-assets/png/';

const COLS       = 8;
const BUBBLE_D   = 56;
const BUBBLE_R   = BUBBLE_D / 2;
const GAME_W     = 480;
const GAME_H     = 700;
const GRID_X     = (GAME_W - COLS * BUBBLE_D) / 2;   // 16
const GRID_Y     = 88;
const MAX_ROWS   = 7;   // rows 0–6; row 6 bottom edge at y≈482, well above launcher
const INIT_ROWS  = 4;
const NUM_COLORS = 6;
const NUM_RACC   = 8;
const LAUNCHER_Y = 634;

function colX(c) { return GRID_X + c * BUBBLE_D + BUBBLE_R; }
function rowY(r) { return GRID_Y + r * BUBBLE_D + BUBBLE_R; }

// ─────────────────────────────────────────────────────────────────────────────
//  MenuScene
// ─────────────────────────────────────────────────────────────────────────────
class MenuScene extends Phaser.Scene {
  constructor() { super({ key: 'MenuScene' }); }

  preload() {
    this.load.image('bg',       PACK + 'background-main.png');
    this.load.image('logo',     PACK + 'logo-full.png');
    this.load.image('rac2',     PACK + 'game-racoon2.png');
    this.load.image('play-btn', PACK + 'main-play-button.png');
  }

  create() {
    this.add.image(GAME_W/2, GAME_H/2, 'bg').setDisplaySize(GAME_W, GAME_H);
    this.add.rectangle(GAME_W/2, GAME_H/2, GAME_W, GAME_H, 0x000000, 0.35);

    // logo
    const logo = this.add.image(GAME_W/2, 130, 'logo');
    logo.setScale(Math.min(310 / logo.width, 155 / logo.height));

    // story card
    this.add.rectangle(GAME_W/2, 278, 420, 116, 0xffffff, 0.93).setStrokeStyle(4, 0xcc44aa);
    this.add.text(GAME_W/2, 278,
      'Oh no! The raccoons are\ntrapped in bubbles!\nHelp free them! 🦝', {
        fontFamily: 'Fredoka One', fontSize: '22px', fill: '#44006a', align: 'center'
      }).setOrigin(0.5);

    // character
    const rac = this.add.image(GAME_W/2, 460, 'rac2');
    rac.setScale(Math.min(180 / rac.width, 200 / rac.height));
    this.tweens.add({ targets: rac, y: 445, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    // play button
    const play = this.add.image(GAME_W/2, 600, 'play-btn');
    play.setScale(Math.min(220 / play.width, 70 / play.height));
    play.setInteractive({ useHandCursor: true });
    play.on('pointerdown', () => this.scene.start('GameScene'));
    play.on('pointerover',  () => play.setScale(play.scaleX * 1.09, play.scaleY * 1.09));
    play.on('pointerout',   () => play.setScale(Math.min(220 / play.width, 70 / play.height)));

    // home button
    this.add.text(10, 10, '🏠 Games', {
      fontFamily: 'Fredoka One', fontSize: '20px', fill: '#fff',
      backgroundColor: '#cc44aa', padding: { x: 10, y: 6 }
    }).setInteractive({ useHandCursor: true })
      .on('pointerdown', () => { window.location.href = '../../index.html'; });
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  GameScene
// ─────────────────────────────────────────────────────────────────────────────
class GameScene extends Phaser.Scene {
  constructor() { super({ key: 'GameScene' }); }

  preload() {
    this.load.image('bg-game', PACK + 'background-game.png');
    this.load.image('rac-face', PACK + 'game-raccooon.png');
    for (let i = 1; i <= NUM_COLORS; i++) {
      this.load.image('b' + i, PACK + String(i).padStart(2, '0') + '.png');
    }
  }

  create() {
    this.saved    = 0;
    this.shooting = false;
    this.grid     = [];

    this.add.image(GAME_W/2, GAME_H/2, 'bg-game').setDisplaySize(GAME_W, GAME_H);

    // ── HUD ─────────────────────────────────────────────────────────────────
    this.add.text(10, 10, '🏠 Games', {
      fontFamily: 'Fredoka One', fontSize: '18px', fill: '#fff',
      backgroundColor: '#cc44aa', padding: { x: 8, y: 5 }
    }).setInteractive({ useHandCursor: true })
      .on('pointerdown', () => { window.location.href = '../../index.html'; });

    this.counterText = this.add.text(GAME_W/2, 12, `🦝 0 / ${NUM_RACC} rescued`, {
      fontFamily: 'Fredoka One', fontSize: '22px', fill: '#fff',
      stroke: '#44006a', strokeThickness: 4
    }).setOrigin(0.5, 0);

    // ── Grid ─────────────────────────────────────────────────────────────────
    this.initGrid();

    // Column dividers (subtle)
    const gfx = this.add.graphics();
    gfx.lineStyle(1, 0xffffff, 0.12);
    for (let c = 0; c <= COLS; c++) {
      const x = GRID_X + c * BUBBLE_D;
      gfx.moveTo(x, GRID_Y);
      gfx.lineTo(x, GRID_Y + MAX_ROWS * BUBBLE_D);
    }
    gfx.strokePath();

    // ── Launcher ─────────────────────────────────────────────────────────────
    this.curColor = Phaser.Math.Between(1, NUM_COLORS);
    this.nxtColor = Phaser.Math.Between(1, NUM_COLORS);
    this.buildLauncher();

    // ── Column tap zones ─────────────────────────────────────────────────────
    for (let c = 0; c < COLS; c++) {
      this.add.zone(colX(c), GAME_H / 2, BUBBLE_D, GAME_H)
        .setInteractive()
        .on('pointerdown', () => this.shoot(c));
    }
  }

  // ── Grid helpers ────────────────────────────────────────────────────────────
  initGrid() {
    for (let r = 0; r < MAX_ROWS; r++) {
      this.grid[r] = [];
      for (let c = 0; c < COLS; c++) {
        this.grid[r][c] = { color: null, raccoon: false, obj: [] };
      }
    }

    // Scatter raccoons across initial rows
    const racSet = new Set();
    while (racSet.size < NUM_RACC) {
      const r = Phaser.Math.Between(0, INIT_ROWS - 1);
      const c = Phaser.Math.Between(0, COLS - 1);
      racSet.add(r * COLS + c);
    }

    for (let r = 0; r < INIT_ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const color = Phaser.Math.Between(1, NUM_COLORS);
        const isRac = racSet.has(r * COLS + c);
        this.placeCell(r, c, color, isRac);
      }
    }
  }

  placeCell(r, c, color, isRac) {
    this.clearCell(r, c);
    const x = colX(c), y = rowY(r);
    const bub = this.add.image(x, y, 'b' + color).setDisplaySize(BUBBLE_D, BUBBLE_D);
    const objs = [bub];
    if (isRac) {
      const face = this.add.image(x, y, 'rac-face').setDisplaySize(BUBBLE_D * 0.52, BUBBLE_D * 0.52);
      objs.push(face);
    }
    this.grid[r][c] = { color, raccoon: isRac, obj: objs };
  }

  clearCell(r, c) {
    const cell = this.grid[r]?.[c];
    if (!cell) return;
    cell.obj.forEach(o => o.destroy());
    this.grid[r][c] = { color: null, raccoon: false, obj: [] };
  }

  // ── Launcher ────────────────────────────────────────────────────────────────
  buildLauncher() {
    const lx = GAME_W / 2, ly = LAUNCHER_Y;
    this.add.rectangle(lx, ly, 250, 104, 0x44006a, 0.82).setStrokeStyle(3, 0xcc44aa);
    this.add.text(lx - 60, ly - 30, 'Next:', {
      fontFamily: 'Fredoka One', fontSize: '15px', fill: '#ffdd44'
    }).setOrigin(0.5);
    this.curSprite = this.add.image(lx,      ly,      'b' + this.curColor).setDisplaySize(54, 54);
    this.nxtSprite = this.add.image(lx + 72, ly - 10, 'b' + this.nxtColor).setDisplaySize(36, 36);
    this.add.text(lx, ly + 36, 'Tap a column to shoot!', {
      fontFamily: 'Fredoka One', fontSize: '14px', fill: '#fff'
    }).setOrigin(0.5);
  }

  refreshLauncher() {
    this.curSprite.setTexture('b' + this.curColor);
    this.nxtSprite.setTexture('b' + this.nxtColor);

    // little pulse on new current bubble
    this.tweens.add({ targets: this.curSprite, scaleX: 1.15, scaleY: 1.15, duration: 100, yoyo: true });
  }

  // ── Shooting ────────────────────────────────────────────────────────────────
  shoot(c) {
    if (this.shooting) return;

    // Find first empty row top→bottom (bubble lands just below existing stack)
    let target = -1;
    for (let r = 0; r < MAX_ROWS; r++) {
      if (!this.grid[r][c].color) { target = r; break; }
    }
    if (target === -1) return; // column full, ignore tap

    this.shooting = true;
    const color = this.curColor;

    // Animate bullet flying up
    const bullet = this.add.image(colX(c), LAUNCHER_Y - 42, 'b' + color).setDisplaySize(BUBBLE_D, BUBBLE_D);
    const dist = (LAUNCHER_Y - 42) - rowY(target);
    this.tweens.add({
      targets: bullet,
      y: rowY(target),
      duration: Math.max(140, dist * 0.72),
      ease: 'Linear',
      onComplete: () => {
        bullet.destroy();
        this.land(target, c, color);
      }
    });
  }

  land(r, c, color) {
    this.placeCell(r, c, color, false);

    // Brief entry scale pop
    const cell = this.grid[r][c];
    cell.obj.forEach(o => {
      o.setScale(1.3);
      this.tweens.add({ targets: o, scaleX: 1, scaleY: 1, duration: 120, ease: 'Back.easeOut' });
    });

    const matched = this.flood(r, c, color);

    if (matched.size >= 3) {
      this.popBubbles(matched, () => {
        this.time.delayedCall(220, () => this.dropFloating());
      });
    }

    // Next bubble
    this.curColor = this.nxtColor;
    this.nxtColor = Phaser.Math.Between(1, NUM_COLORS);
    this.refreshLauncher();

    // Unlock shooting after animations settle
    this.time.delayedCall(matched.size >= 3 ? 950 : 80, () => {
      this.shooting = false;
    });
  }

  // ── Match logic ─────────────────────────────────────────────────────────────

  // Flood-fill same color from (r,c)
  flood(r, c, color) {
    const visited = new Set();
    const q = [[r, c]];
    while (q.length) {
      const [cr, cc] = q.pop();
      const k = cr * 100 + cc;
      if (visited.has(k)) continue;
      if (cr < 0 || cr >= MAX_ROWS || cc < 0 || cc >= COLS) continue;
      if (this.grid[cr][cc].color !== color) continue;
      visited.add(k);
      q.push([cr-1, cc], [cr+1, cc], [cr, cc-1], [cr, cc+1]);
    }
    return visited;
  }

  // Flood-fill any non-null from (r,c)
  floodAny(r, c) {
    const visited = new Set();
    const q = [[r, c]];
    while (q.length) {
      const [cr, cc] = q.pop();
      const k = cr * 100 + cc;
      if (visited.has(k)) continue;
      if (cr < 0 || cr >= MAX_ROWS || cc < 0 || cc >= COLS) continue;
      if (!this.grid[cr][cc].color) continue;
      visited.add(k);
      q.push([cr-1, cc], [cr+1, cc], [cr, cc-1], [cr, cc+1]);
    }
    return visited;
  }

  popBubbles(keys, onDone) {
    let freed = 0;
    keys.forEach(k => {
      const r = Math.floor(k / 100), c = k % 100;
      const cell = this.grid[r][c];
      if (!cell.color) return;
      if (cell.raccoon) {
        freed++;
        this.showSaved(colX(c), rowY(r));
      }
      this.showSparkle(colX(c), rowY(r));
      cell.obj.forEach(o =>
        this.tweens.add({ targets: o, scaleX: 0, scaleY: 0, alpha: 0, duration: 210, onComplete: () => o.destroy() })
      );
      this.grid[r][c] = { color: null, raccoon: false, obj: [] };
    });

    if (freed > 0) {
      this.saved += freed;
      this.counterText.setText(`🦝 ${this.saved} / ${NUM_RACC} rescued`);
      if (this.saved >= NUM_RACC) {
        this.time.delayedCall(950, () => this.scene.start('WinScene'));
        return;
      }
    }
    if (onDone) this.time.delayedCall(250, onDone);
  }

  // Remove any bubble not connected to row 0 (gravity drop)
  dropFloating() {
    const anchored = new Set();
    for (let c = 0; c < COLS; c++) {
      if (this.grid[0][c].color) {
        this.floodAny(0, c).forEach(k => anchored.add(k));
      }
    }
    const floating = new Set();
    for (let r = 0; r < MAX_ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const k = r * 100 + c;
        if (this.grid[r][c].color && !anchored.has(k)) floating.add(k);
      }
    }
    if (floating.size) this.popBubbles(floating, null);
  }

  // ── Feedback effects ────────────────────────────────────────────────────────
  showSaved(x, y) {
    const t = this.add.text(x, y, '🦝 Saved!', {
      fontFamily: 'Fredoka One', fontSize: '21px', fill: '#ffee00',
      stroke: '#44006a', strokeThickness: 4
    }).setOrigin(0.5).setDepth(20);
    this.tweens.add({ targets: t, y: y - 72, alpha: 0, duration: 1250, onComplete: () => t.destroy() });
  }

  showSparkle(x, y) {
    const clrs = ['#ff44aa', '#ffdd00', '#44aaff', '#44ff88', '#ff8844'];
    for (let i = 0; i < 6; i++) {
      const s = this.add.text(x, y, '★', {
        fontSize: '19px', fill: clrs[i % clrs.length]
      }).setOrigin(0.5).setDepth(18);
      const angle = (i / 6) * Math.PI * 2;
      this.tweens.add({
        targets: s,
        x: x + Math.cos(angle) * 46,
        y: y + Math.sin(angle) * 46,
        alpha: 0,
        duration: 500,
        onComplete: () => s.destroy()
      });
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  WinScene
// ─────────────────────────────────────────────────────────────────────────────
class WinScene extends Phaser.Scene {
  constructor() { super({ key: 'WinScene' }); }

  preload() {
    this.load.image('bg',       PACK + 'background-main.png');
    this.load.image('panel',    PACK + 'pop-completed.png');
    this.load.image('confetti', PACK + 'pop-completed-confeti.png');
    this.load.image('rac-big',  PACK + 'raccoon-big.png');
    this.load.image('play-btn', PACK + 'main-play-button.png');
  }

  create() {
    this.add.image(GAME_W/2, GAME_H/2, 'bg').setDisplaySize(GAME_W, GAME_H);
    this.add.rectangle(GAME_W/2, GAME_H/2, GAME_W, GAME_H, 0x000000, 0.45);

    // confetti layer (fades in)
    const conf = this.add.image(GAME_W/2, GAME_H/2 - 60, 'confetti').setDisplaySize(GAME_W, GAME_H * 0.75).setAlpha(0);
    this.tweens.add({ targets: conf, alpha: 1, duration: 600 });

    // panel
    this.add.image(GAME_W/2, GAME_H/2 + 40, 'panel').setDisplaySize(390, 370);

    // big raccoon bouncing on top of panel
    const rac = this.add.image(GAME_W/2, 198, 'rac-big').setDisplaySize(148, 148);
    this.tweens.add({ targets: rac, y: 184, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    // win text
    this.add.text(GAME_W/2, 350, 'You rescued all\nthe raccoons, Kaylee!', {
      fontFamily: 'Fredoka One', fontSize: '28px', fill: '#44006a', align: 'center'
    }).setOrigin(0.5);
    this.add.text(GAME_W/2, 442, '🦝 You\'re a hero! 🦝', {
      fontFamily: 'Fredoka One', fontSize: '24px', fill: '#cc44aa'
    }).setOrigin(0.5);

    // play again
    const play = this.add.image(GAME_W/2, 545, 'play-btn').setDisplaySize(215, 64).setInteractive({ useHandCursor: true });
    play.on('pointerdown', () => this.scene.start('GameScene'));
    play.on('pointerover',  () => play.setScale(play.scaleX * 1.08, play.scaleY * 1.08));
    play.on('pointerout',   () => play.setDisplaySize(215, 64));

    // home
    this.add.text(10, 10, '🏠 Games', {
      fontFamily: 'Fredoka One', fontSize: '20px', fill: '#fff',
      backgroundColor: '#cc44aa', padding: { x: 10, y: 6 }
    }).setInteractive({ useHandCursor: true })
      .on('pointerdown', () => { window.location.href = '../../index.html'; });

    // celebration stars raining down
    this.time.addEvent({ delay: 220, callback: this.spawnStar, callbackScope: this, repeat: 35 });
  }

  spawnStar() {
    const x = Phaser.Math.Between(30, GAME_W - 30);
    const y = Phaser.Math.Between(30, GAME_H - 30);
    const s = this.add.text(x, y, '⭐', { fontSize: '26px' }).setOrigin(0.5);
    this.tweens.add({ targets: s, y: y - 90, alpha: 0, duration: 1100, onComplete: () => s.destroy() });
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────────────────────────────────────
new Phaser.Game({
  type: Phaser.AUTO,
  width: GAME_W,
  height: GAME_H,
  backgroundColor: '#1a0533',
  scene: [MenuScene, GameScene, WinScene],
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  }
});
</script>
</body>
</html>
