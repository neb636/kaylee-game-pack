<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Forest Gem Match - Kaylee's Game World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #1a5c2a;
      font-family: 'Fredoka One', cursive;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; margin: 0 auto; }
    #back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: rgba(255,255,255,0.92);
      border: 3px solid #7b2ff7;
      border-radius: 30px;
      padding: 8px 18px;
      font-family: 'Fredoka One', cursive;
      font-size: 18px;
      color: #7b2ff7;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      transition: transform 0.15s;
    }
    #back-btn:hover { transform: scale(1.08); }
  </style>
</head>
<body>
  <a id="back-btn" href="/index.html">🏠 Games</a>
  <script src="/kaylee-game-pack/pr-preview/pr-7/lib/phaser.min.js"></script>
  <script>
// ============================================================
//  Forest Gem Match — a gentle Match-3 for Kaylee (age 5)
// ============================================================

const ASSET_ROOT = '../../packs/craftpix-net-741915-forest-match-3-gui-assets/png/';

const COLS = 7;
const ROWS = 7;
const GEM_TYPES = 6; // game item1 … game item6
const LEVELS = [
  { target: 30,  label: 'Level 1' },
  { target: 50,  label: 'Level 2' },
  { target: 75,  label: 'Level 3' },
];

// ─── Boot Scene ──────────────────────────────────────────────
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }

  preload() {
    // Gems
    for (let i = 1; i <= GEM_TYPES; i++) {
      this.load.image('gem' + i, ASSET_ROOT + 'game item' + i + '.png');
    }
    // UI
    this.load.image('bg', ASSET_ROOT + 'bg.png');
    this.load.image('gameBg', ASSET_ROOT + 'game-bg.png');
    this.load.image('won', ASSET_ROOT + 'won.png');
    this.load.image('starYellow', ASSET_ROOT + 'game star yellow.png');
    this.load.image('starsColor', ASSET_ROOT + 'stars color.png');
    this.load.image('btnPlay', ASSET_ROOT + 'button play.png');
    this.load.image('logo', ASSET_ROOT + 'main logo.png');
    this.load.image('btnNext', ASSET_ROOT + 'button big next.png');
  }

  create() {
    this.scene.start('Menu');
  }
}

// ─── Menu Scene ──────────────────────────────────────────────
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }

  create() {
    const { width, height } = this.scale;

    // Background
    const bg = this.add.image(width / 2, height / 2, 'bg');
    bg.setDisplaySize(width, height);

    // Logo
    const logo = this.add.image(width / 2, height * 0.25, 'logo');
    logo.setScale(Math.min(0.5, (width * 0.7) / logo.width));

    // Subtitle
    this.add.text(width / 2, height * 0.44, 'A Match-3 Adventure!', {
      fontFamily: 'Fredoka One',
      fontSize: '28px',
      color: '#ffffff',
      stroke: '#2d6b1e',
      strokeThickness: 4,
    }).setOrigin(0.5);

    // Play button
    const btn = this.add.image(width / 2, height * 0.62, 'btnPlay')
      .setScale(0.55)
      .setInteractive({ useHandCursor: true });

    this.tweens.add({
      targets: btn,
      scaleX: 0.60,
      scaleY: 0.60,
      duration: 800,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut',
    });

    btn.on('pointerdown', () => {
      this.scene.start('Game', { level: 0 });
    });

    // Floating gems decoration
    const gemNames = ['gem1', 'gem2', 'gem3', 'gem4', 'gem5', 'gem6'];
    for (let i = 0; i < 8; i++) {
      const g = this.add.image(
        Phaser.Math.Between(40, width - 40),
        Phaser.Math.Between(height * 0.7, height - 40),
        Phaser.Math.RND.pick(gemNames)
      ).setScale(0.25).setAlpha(0.5);
      this.tweens.add({
        targets: g,
        y: g.y - 20,
        duration: Phaser.Math.Between(1500, 3000),
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut',
      });
    }
  }
}

// ─── Game Scene ──────────────────────────────────────────────
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  init(data) {
    this.levelIndex = data.level || 0;
    this.levelData = LEVELS[this.levelIndex];
    this.score = 0;
    this.selectedGem = null;
    this.busy = false; // prevents input during animations
  }

  create() {
    const { width, height } = this.scale;

    // Background
    const gameBg = this.add.image(width / 2, height / 2, 'gameBg');
    gameBg.setDisplaySize(width, height);

    // Calculate board geometry
    const BOARD_TOP = 120;
    const availW = width - 30;
    const availH = height - BOARD_TOP - 80;
    this.cellSize = Math.min(availW / COLS, availH / ROWS);
    this.boardX = (width - COLS * this.cellSize) / 2;
    this.boardY = BOARD_TOP;

    // ── HUD ──
    // Level label
    this.add.text(width / 2, 20, this.levelData.label, {
      fontFamily: 'Fredoka One',
      fontSize: '26px',
      color: '#ffffff',
      stroke: '#5c3310',
      strokeThickness: 4,
    }).setOrigin(0.5, 0);

    // Progress bar background
    const barW = width * 0.6;
    const barH = 28;
    const barX = (width - barW) / 2;
    const barY = 56;

    this.add.graphics()
      .fillStyle(0x3a2010, 0.7)
      .fillRoundedRect(barX, barY, barW, barH, 14);

    this.progressBar = this.add.graphics();
    this.progressText = this.add.text(width / 2, barY + barH / 2, '', {
      fontFamily: 'Fredoka One',
      fontSize: '16px',
      color: '#ffffff',
      stroke: '#2d6b1e',
      strokeThickness: 3,
    }).setOrigin(0.5);

    this.barX = barX;
    this.barY = barY;
    this.barW = barW;
    this.barH = barH;

    // Score text
    const star = this.add.image(width / 2 - 60, 96, 'starYellow').setScale(0.35);
    this.scoreText = this.add.text(width / 2 - 35, 96, '0', {
      fontFamily: 'Fredoka One',
      fontSize: '22px',
      color: '#FFD700',
      stroke: '#5c3310',
      strokeThickness: 3,
    }).setOrigin(0, 0.5);

    // Draw board background
    const boardGfx = this.add.graphics();
    boardGfx.fillStyle(0x000000, 0.18);
    boardGfx.fillRoundedRect(
      this.boardX - 6, this.boardY - 6,
      COLS * this.cellSize + 12, ROWS * this.cellSize + 12, 12
    );

    // Build the grid
    this.grid = [];      // grid[row][col] = { type, sprite }
    this.gems = this.add.group();

    for (let r = 0; r < ROWS; r++) {
      this.grid[r] = [];
      for (let c = 0; c < COLS; c++) {
        const type = this.pickType(r, c);
        const gem = this.createGem(r, c, type);
        this.grid[r][c] = { type, sprite: gem };
      }
    }

    // Selection indicator
    this.selectRect = this.add.graphics();

    // Glow indicators for valid swaps
    this.glowSprites = [];

    this.updateHUD();
  }

  // Pick a gem type that doesn't immediately create a match
  pickType(row, col) {
    const avoid = new Set();
    // check left
    if (col >= 2 &&
        this.grid[row] &&
        this.grid[row][col - 1] && this.grid[row][col - 2] &&
        this.grid[row][col - 1].type === this.grid[row][col - 2].type) {
      avoid.add(this.grid[row][col - 1].type);
    }
    // check up
    if (row >= 2 &&
        this.grid[row - 1] && this.grid[row - 2] &&
        this.grid[row - 1][col] && this.grid[row - 2][col] &&
        this.grid[row - 1][col].type === this.grid[row - 2][col].type) {
      avoid.add(this.grid[row - 1][col].type);
    }
    let type;
    do {
      type = Phaser.Math.Between(1, GEM_TYPES);
    } while (avoid.has(type));
    return type;
  }

  createGem(row, col, type) {
    const x = this.boardX + col * this.cellSize + this.cellSize / 2;
    const y = this.boardY + row * this.cellSize + this.cellSize / 2;
    const gem = this.add.image(x, y, 'gem' + type)
      .setDisplaySize(this.cellSize * 0.82, this.cellSize * 0.82)
      .setInteractive({ useHandCursor: true });
    gem.gridRow = row;
    gem.gridCol = col;

    gem.on('pointerdown', () => this.onGemClick(row, col));

    this.gems.add(gem);
    return gem;
  }

  onGemClick(row, col) {
    if (this.busy) return;

    if (!this.selectedGem) {
      // First selection
      this.selectedGem = { row, col };
      this.drawSelection(row, col);
      this.showValidSwaps(row, col);
    } else if (this.selectedGem.row === row && this.selectedGem.col === col) {
      // Deselect
      this.clearSelection();
    } else if (this.isAdjacent(this.selectedGem, { row, col })) {
      // Attempt swap
      this.clearSelection();
      this.trySwap(this.selectedGem.row, this.selectedGem.col, row, col);
    } else {
      // Select new gem
      this.selectedGem = { row, col };
      this.drawSelection(row, col);
      this.showValidSwaps(row, col);
    }
  }

  isAdjacent(a, b) {
    return (Math.abs(a.row - b.row) + Math.abs(a.col - b.col)) === 1;
  }

  drawSelection(row, col) {
    this.selectRect.clear();
    const x = this.boardX + col * this.cellSize;
    const y = this.boardY + row * this.cellSize;
    this.selectRect.lineStyle(4, 0xFFFFFF, 0.9);
    this.selectRect.strokeRoundedRect(x + 2, y + 2, this.cellSize - 4, this.cellSize - 4, 8);

    // Pulse the selected gem
    const cell = this.grid[row][col];
    if (cell && cell.sprite) {
      this.tweens.add({
        targets: cell.sprite,
        scaleX: cell.sprite.scaleX * 1.12,
        scaleY: cell.sprite.scaleY * 1.12,
        duration: 300,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut',
      });
    }
  }

  showValidSwaps(row, col) {
    this.clearGlows();
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (const [dr, dc] of dirs) {
      const nr = row + dr;
      const nc = col + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        // Test if swapping would produce a match
        if (this.wouldMatch(row, col, nr, nc)) {
          const x = this.boardX + nc * this.cellSize + this.cellSize / 2;
          const y = this.boardY + nr * this.cellSize + this.cellSize / 2;
          const glow = this.add.graphics();
          glow.lineStyle(3, 0xFFD700, 0.7);
          const sz = this.cellSize * 0.9;
          glow.strokeRoundedRect(x - sz/2, y - sz/2, sz, sz, 8);
          this.tweens.add({
            targets: glow,
            alpha: 0.3,
            duration: 500,
            yoyo: true,
            repeat: -1,
          });
          this.glowSprites.push(glow);
        }
      }
    }
  }

  wouldMatch(r1, c1, r2, c2) {
    // Simulate swap and check for matches
    const t1 = this.grid[r1][c1].type;
    const t2 = this.grid[r2][c2].type;
    // Temporarily swap types
    this.grid[r1][c1].type = t2;
    this.grid[r2][c2].type = t1;
    const hasMatch = this.findMatches().length > 0;
    // Swap back
    this.grid[r1][c1].type = t1;
    this.grid[r2][c2].type = t2;
    return hasMatch;
  }

  clearSelection() {
    this.selectRect.clear();
    this.clearGlows();
    if (this.selectedGem) {
      const cell = this.grid[this.selectedGem.row][this.selectedGem.col];
      if (cell && cell.sprite) {
        this.tweens.killTweensOf(cell.sprite);
        const baseScale = this.cellSize * 0.82;
        cell.sprite.setDisplaySize(baseScale, baseScale);
      }
    }
    this.selectedGem = null;
  }

  clearGlows() {
    this.glowSprites.forEach(g => g.destroy());
    this.glowSprites = [];
  }

  async trySwap(r1, c1, r2, c2) {
    this.busy = true;

    // Animate swap
    await this.animateSwap(r1, c1, r2, c2);

    // Swap in grid
    this.swapGrid(r1, c1, r2, c2);

    // Check matches
    const matches = this.findMatches();
    if (matches.length > 0) {
      await this.processMatches(matches);
    } else {
      // Swap back — invalid move, but no penalty!
      await this.animateSwap(r1, c1, r2, c2);
      this.swapGrid(r1, c1, r2, c2);
      // Gentle wobble on the gems
      this.wobble(this.grid[r1][c1].sprite);
      this.wobble(this.grid[r2][c2].sprite);
    }

    this.busy = false;
  }

  swapGrid(r1, c1, r2, c2) {
    const tmp = this.grid[r1][c1];
    this.grid[r1][c1] = this.grid[r2][c2];
    this.grid[r2][c2] = tmp;

    // Update sprite grid references
    if (this.grid[r1][c1].sprite) {
      this.grid[r1][c1].sprite.gridRow = r1;
      this.grid[r1][c1].sprite.gridCol = c1;
    }
    if (this.grid[r2][c2].sprite) {
      this.grid[r2][c2].sprite.gridRow = r2;
      this.grid[r2][c2].sprite.gridCol = c2;
    }
  }

  animateSwap(r1, c1, r2, c2) {
    const s1 = this.grid[r1][c1].sprite;
    const s2 = this.grid[r2][c2].sprite;
    const dur = 180;

    const x1 = this.boardX + c1 * this.cellSize + this.cellSize / 2;
    const y1 = this.boardY + r1 * this.cellSize + this.cellSize / 2;
    const x2 = this.boardX + c2 * this.cellSize + this.cellSize / 2;
    const y2 = this.boardY + r2 * this.cellSize + this.cellSize / 2;

    return new Promise(resolve => {
      this.tweens.add({
        targets: s1,
        x: x2, y: y2,
        duration: dur,
        ease: 'Quad.easeInOut',
      });
      this.tweens.add({
        targets: s2,
        x: x1, y: y1,
        duration: dur,
        ease: 'Quad.easeInOut',
        onComplete: resolve,
      });
    });
  }

  wobble(sprite) {
    if (!sprite) return;
    this.tweens.add({
      targets: sprite,
      x: sprite.x - 6,
      duration: 60,
      yoyo: true,
      repeat: 2,
      ease: 'Sine.easeInOut',
    });
  }

  findMatches() {
    const matched = new Set();

    // Horizontal
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 3; c++) {
        const t = this.grid[r][c].type;
        if (t && t === this.grid[r][c+1].type && t === this.grid[r][c+2].type) {
          // extend
          let end = c + 2;
          while (end + 1 < COLS && this.grid[r][end+1].type === t) end++;
          for (let i = c; i <= end; i++) matched.add(r * COLS + i);
        }
      }
    }

    // Vertical
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r <= ROWS - 3; r++) {
        const t = this.grid[r][c].type;
        if (t && t === this.grid[r+1][c].type && t === this.grid[r+2][c].type) {
          let end = r + 2;
          while (end + 1 < ROWS && this.grid[end+1][c].type === t) end++;
          for (let i = r; i <= end; i++) matched.add(i * COLS + c);
        }
      }
    }

    return [...matched].map(idx => ({
      row: Math.floor(idx / COLS),
      col: idx % COLS,
    }));
  }

  async processMatches(matches) {
    // Pop matched gems
    await this.popGems(matches);

    // Add score
    this.score += matches.length;
    this.updateHUD();

    // Gravity — drop gems
    await this.applyGravity();

    // Fill empty spaces
    await this.fillEmpty();

    // Check for cascading matches
    const newMatches = this.findMatches();
    if (newMatches.length > 0) {
      await this.processMatches(newMatches);
    }

    // Check win condition
    if (this.score >= this.levelData.target) {
      this.busy = true;
      this.time.delayedCall(400, () => this.levelComplete());
    }
  }

  popGems(matches) {
    return new Promise(resolve => {
      let count = matches.length;
      if (count === 0) { resolve(); return; }

      matches.forEach(({ row, col }) => {
        const cell = this.grid[row][col];
        if (!cell.sprite) { count--; if (count <= 0) resolve(); return; }

        // Burst particles
        this.burstAt(
          this.boardX + col * this.cellSize + this.cellSize / 2,
          this.boardY + row * this.cellSize + this.cellSize / 2,
          cell.type
        );

        this.tweens.add({
          targets: cell.sprite,
          scaleX: 0,
          scaleY: 0,
          alpha: 0,
          duration: 220,
          ease: 'Back.easeIn',
          onComplete: () => {
            cell.sprite.destroy();
            cell.sprite = null;
            cell.type = 0;
            count--;
            if (count <= 0) resolve();
          }
        });
      });
    });
  }

  burstAt(x, y, gemType) {
    const colors = [0x8BC34A, 0x42A5F5, 0xCE93D8, 0xFF9800, 0xFFEB3B, 0xE91E63];
    const color = colors[(gemType - 1) % colors.length];

    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const dist = Phaser.Math.Between(30, 60);
      const p = this.add.circle(x, y, Phaser.Math.Between(4, 8), color, 1);
      this.tweens.add({
        targets: p,
        x: x + Math.cos(angle) * dist,
        y: y + Math.sin(angle) * dist,
        alpha: 0,
        scaleX: 0,
        scaleY: 0,
        duration: 400,
        ease: 'Quad.easeOut',
        onComplete: () => p.destroy(),
      });
    }
  }

  applyGravity() {
    const promises = [];

    for (let c = 0; c < COLS; c++) {
      let writeRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (this.grid[r][c].type !== 0) {
          if (r !== writeRow) {
            // Move gem from r to writeRow
            this.grid[writeRow][c] = this.grid[r][c];
            this.grid[r][c] = { type: 0, sprite: null };

            const sprite = this.grid[writeRow][c].sprite;
            if (sprite) {
              sprite.gridRow = writeRow;
              sprite.gridCol = c;
              const targetY = this.boardY + writeRow * this.cellSize + this.cellSize / 2;
              promises.push(new Promise(resolve => {
                this.tweens.add({
                  targets: sprite,
                  y: targetY,
                  duration: 150 + (writeRow - r) * 40,
                  ease: 'Bounce.easeOut',
                  onComplete: resolve,
                });
              }));
            }
          }
          writeRow--;
        }
      }
    }

    return promises.length > 0
      ? Promise.all(promises)
      : Promise.resolve();
  }

  fillEmpty() {
    const promises = [];

    for (let c = 0; c < COLS; c++) {
      let emptyCount = 0;
      for (let r = 0; r < ROWS; r++) {
        if (this.grid[r][c].type === 0) emptyCount++;
      }

      let fillIdx = 0;
      for (let r = 0; r < ROWS; r++) {
        if (this.grid[r][c].type === 0) {
          const type = Phaser.Math.Between(1, GEM_TYPES);
          const x = this.boardX + c * this.cellSize + this.cellSize / 2;
          const startY = this.boardY - (emptyCount - fillIdx) * this.cellSize;
          const targetY = this.boardY + r * this.cellSize + this.cellSize / 2;

          const gem = this.add.image(x, startY, 'gem' + type)
            .setDisplaySize(this.cellSize * 0.82, this.cellSize * 0.82)
            .setInteractive({ useHandCursor: true });
          gem.gridRow = r;
          gem.gridCol = c;
          gem.on('pointerdown', () => this.onGemClick(r, c));
          this.gems.add(gem);

          this.grid[r][c] = { type, sprite: gem };

          promises.push(new Promise(resolve => {
            this.tweens.add({
              targets: gem,
              y: targetY,
              duration: 250 + fillIdx * 50,
              ease: 'Bounce.easeOut',
              onComplete: resolve,
            });
          }));

          fillIdx++;
        }
      }
    }

    return promises.length > 0
      ? Promise.all(promises)
      : Promise.resolve();
  }

  updateHUD() {
    // Progress bar
    const pct = Math.min(this.score / this.levelData.target, 1);
    this.progressBar.clear();
    if (pct > 0) {
      this.progressBar.fillStyle(0x8BC34A, 1);
      this.progressBar.fillRoundedRect(
        this.barX + 3, this.barY + 3,
        Math.max(20, (this.barW - 6) * pct), this.barH - 6, 12
      );
    }
    this.progressText.setText(`${Math.min(this.score, this.levelData.target)} / ${this.levelData.target}`);
    this.scoreText.setText('' + this.score);
  }

  levelComplete() {
    this.scene.start('Win', { level: this.levelIndex, score: this.score });
  }
}

// ─── Win Scene ───────────────────────────────────────────────
class WinScene extends Phaser.Scene {
  constructor() { super('Win'); }

  init(data) {
    this.levelIndex = data.level;
    this.finalScore = data.score;
  }

  create() {
    const { width, height } = this.scale;

    // Background
    const bg = this.add.image(width / 2, height / 2, 'bg');
    bg.setDisplaySize(width, height);
    bg.setTint(0xccffcc);

    // Confetti
    this.spawnConfetti(width, height);

    // Stars decoration
    const stars = this.add.image(width / 2, height * 0.12, 'starsColor')
      .setScale(Math.min(0.5, (width * 0.6) / 640));

    // "You Won!" panel
    const wonPanel = this.add.image(width / 2, height * 0.36, 'won')
      .setScale(Math.min(0.45, (width * 0.7) / 1040));

    // Star rating
    for (let i = 0; i < 3; i++) {
      const star = this.add.image(
        width / 2 + (i - 1) * 60,
        height * 0.48,
        'starYellow'
      ).setScale(0);

      this.tweens.add({
        targets: star,
        scaleX: 0.5,
        scaleY: 0.5,
        duration: 400,
        delay: 300 + i * 250,
        ease: 'Back.easeOut',
      });
    }

    // Custom message
    const isLastLevel = this.levelIndex >= LEVELS.length - 1;
    const msgText = isLastLevel
      ? "You cleared the forest, Kaylee!\nAmazing!"
      : `${LEVELS[this.levelIndex].label} Complete!`;

    this.add.text(width / 2, height * 0.60, msgText, {
      fontFamily: 'Fredoka One',
      fontSize: '28px',
      color: '#ffffff',
      stroke: '#2d6b1e',
      strokeThickness: 5,
      align: 'center',
    }).setOrigin(0.5);

    // Score
    this.add.text(width / 2, height * 0.71, `Gems matched: ${this.finalScore}`, {
      fontFamily: 'Fredoka One',
      fontSize: '22px',
      color: '#FFD700',
      stroke: '#5c3310',
      strokeThickness: 3,
    }).setOrigin(0.5);

    // Next / Menu button
    if (!isLastLevel) {
      const nextBtn = this.add.image(width / 2, height * 0.83, 'btnNext')
        .setScale(0.45)
        .setInteractive({ useHandCursor: true });
      nextBtn.on('pointerdown', () => {
        this.scene.start('Game', { level: this.levelIndex + 1 });
      });
      this.tweens.add({
        targets: nextBtn,
        scaleX: 0.50,
        scaleY: 0.50,
        duration: 800,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut',
      });
    } else {
      const playBtn = this.add.image(width / 2, height * 0.83, 'btnPlay')
        .setScale(0.45)
        .setInteractive({ useHandCursor: true });
      this.add.text(width / 2, height * 0.83, 'Play Again!', {
        fontFamily: 'Fredoka One',
        fontSize: '20px',
        color: '#ffffff',
        stroke: '#2d6b1e',
        strokeThickness: 3,
      }).setOrigin(0.5);
      playBtn.on('pointerdown', () => {
        this.scene.start('Menu');
      });
    }
  }

  spawnConfetti(width, height) {
    const colors = [0xFF6B9D, 0xC084FC, 0x67E8F9, 0xFDE047, 0x86EFAC, 0xFF9800];
    for (let i = 0; i < 60; i++) {
      const x = Phaser.Math.Between(0, width);
      const size = Phaser.Math.Between(5, 12);
      const color = Phaser.Math.RND.pick(colors);
      const shape = Math.random() > 0.5
        ? this.add.rectangle(x, -20, size, size * 1.5, color)
        : this.add.circle(x, -20, size / 2, color);

      this.tweens.add({
        targets: shape,
        y: height + 20,
        x: x + Phaser.Math.Between(-80, 80),
        angle: Phaser.Math.Between(0, 720),
        duration: Phaser.Math.Between(2000, 4000),
        delay: Phaser.Math.Between(0, 1500),
        ease: 'Quad.easeIn',
        onComplete: () => {
          // Loop it
          shape.y = -20;
          shape.x = Phaser.Math.Between(0, width);
          this.tweens.add({
            targets: shape,
            y: height + 20,
            x: shape.x + Phaser.Math.Between(-80, 80),
            angle: Phaser.Math.Between(0, 720),
            duration: Phaser.Math.Between(2000, 4000),
            ease: 'Quad.easeIn',
            repeat: -1,
          });
        }
      });
    }
  }
}

// ─── Phaser config ───────────────────────────────────────────
const config = {
  type: Phaser.AUTO,
  width: Math.min(window.innerWidth, 480),
  height: Math.min(window.innerHeight, 860),
  backgroundColor: '#1a5c2a',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
  },
  scene: [BootScene, MenuScene, GameScene, WinScene],
};

const game = new Phaser.Game(config);
  </script>
</body>
