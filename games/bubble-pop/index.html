<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bubble Pop Princess</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a0533;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>
<script src="/lib/phaser.min.js"></script>
<script>
const PACK = '../../packs/craftpix-781165-bubble-shooter-game-assets-pack/png/';

const COLS       = 8;
const ROWS       = 6;
const BUBBLE_D   = 54;
const BUBBLE_R   = BUBBLE_D / 2;
const GAME_W     = 480;
const GAME_H     = 720;
const GRID_X     = (GAME_W - COLS * BUBBLE_D) / 2;
const GRID_Y     = 80;
const LAUNCHER_Y = 620;

const COLORS = ['blue', 'green', 'orange', 'pink', 'red', 'yellow'];

function colX(c) { return GRID_X + c * BUBBLE_D + BUBBLE_R; }
function rowY(r) { return GRID_Y + r * BUBBLE_D + BUBBLE_R; }

// ── Helpers ──────────────────────────────────────────────────────────────────

function neighbors(r, c) {
  return [
    [r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1],
    [r - 1, c - 1], [r - 1, c + 1], [r + 1, c - 1], [r + 1, c + 1]
  ];
}

// BFS to find connected same-color cluster
function findCluster(grid, r, c, color) {
  const visited = new Set();
  const queue = [[r, c]];
  const cluster = [];
  while (queue.length) {
    const [cr, cc] = queue.shift();
    const key = cr + ',' + cc;
    if (visited.has(key)) continue;
    if (cr < 0 || cr >= ROWS || cc < 0 || cc >= COLS) continue;
    if (!grid[cr][cc] || grid[cr][cc].color !== color) continue;
    visited.add(key);
    cluster.push([cr, cc]);
    for (const [nr, nc] of neighbors(cr, cc)) queue.push([nr, nc]);
  }
  return cluster;
}

// BFS from top row to find all connected bubbles
function findFloating(grid) {
  const visited = new Set();
  const queue = [];
  for (let c = 0; c < COLS; c++) {
    if (grid[0][c]) {
      queue.push([0, c]);
      visited.add('0,' + c);
    }
  }
  while (queue.length) {
    const [cr, cc] = queue.shift();
    for (const [nr, nc] of neighbors(cr, cc)) {
      const key = nr + ',' + nc;
      if (visited.has(key)) continue;
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      if (!grid[nr][nc]) continue;
      visited.add(key);
      queue.push([nr, nc]);
    }
  }
  const floating = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] && !visited.has(r + ',' + c)) floating.push([r, c]);
    }
  }
  return floating;
}

// ── MenuScene ────────────────────────────────────────────────────────────────

class MenuScene extends Phaser.Scene {
  constructor() { super({ key: 'MenuScene' }); }

  preload() {
    this.load.image('bg',        PACK + 'bg.png');
    this.load.image('logo',      PACK + 'logo-characters.png');
    this.load.image('play-btn',  PACK + 'button-play-big.png');
    this.load.image('girl-happy', PACK + 'girl-happy.png');
    for (const color of COLORS) {
      this.load.image('bubble-' + color, PACK + 'bubble-' + color + '.png');
    }
    this.load.image('game-girl',    PACK + 'game-girl.png');
    this.load.image('girl-sad',     PACK + 'girl-sad.png');
    this.load.image('cat-win',      PACK + 'cat-win.png');
    this.load.image('star-yellow',  PACK + 'game-star-yellow.png');
    this.load.image('star-grey',    PACK + 'game-star-grey.png');
    this.load.image('btn-replay',   PACK + 'button-replay.png');
    this.load.image('btn-menu',     PACK + 'button-menu.png');
    this.load.image('level-done',   PACK + 'level-completed.png');
    this.load.image('stars-bg',     PACK + 'stars-bg.png');
  }

  create() {
    const bg = this.add.image(GAME_W / 2, GAME_H / 2, 'bg');
    bg.setDisplaySize(GAME_W, GAME_H);

    this.add.image(GAME_W / 2, 200, 'logo').setScale(0.4);

    const playBtn = this.add.image(GAME_W / 2, 480, 'play-btn').setScale(0.65).setInteractive({ useHandCursor: true });
    playBtn.on('pointerover', () => playBtn.setScale(0.7));
    playBtn.on('pointerout', () => playBtn.setScale(0.65));
    playBtn.on('pointerdown', () => this.scene.start('GameScene'));

    // Back button
    const backBtn = this.add.text(16, 16, '\u{1F3E0} Games', {
      fontFamily: 'Fredoka One', fontSize: '22px', fill: '#fff',
      stroke: '#7b2ff7', strokeThickness: 3
    }).setInteractive({ useHandCursor: true });
    backBtn.on('pointerdown', () => { window.location.href = '../../index.html'; });

    // Floating bubbles decoration
    for (let i = 0; i < 12; i++) {
      const color = Phaser.Utils.Array.GetRandom(COLORS);
      const bub = this.add.image(
        Phaser.Math.Between(40, GAME_W - 40),
        Phaser.Math.Between(540, GAME_H - 40),
        'bubble-' + color
      ).setScale(0.4 + Math.random() * 0.2).setAlpha(0.6);
      this.tweens.add({
        targets: bub, y: bub.y - 30, duration: 1500 + Math.random() * 1500,
        yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
      });
    }
  }
}

// ── GameScene ────────────────────────────────────────────────────────────────

class GameScene extends Phaser.Scene {
  constructor() { super({ key: 'GameScene' }); }

  create() {
    this.popCount = 0;
    this.shooting = false;
    this.totalBubbles = 0;

    // Background
    const bg = this.add.image(GAME_W / 2, GAME_H / 2, 'bg');
    bg.setDisplaySize(GAME_W, GAME_H);

    // Back button
    const backBtn = this.add.text(16, 16, '\u{1F3E0} Games', {
      fontFamily: 'Fredoka One', fontSize: '20px', fill: '#fff',
      stroke: '#7b2ff7', strokeThickness: 3
    }).setInteractive({ useHandCursor: true });
    backBtn.on('pointerdown', () => { window.location.href = '../../index.html'; });

    // Pop counter (top right)
    this.popText = this.add.text(GAME_W - 16, 16, 'Popped: 0', {
      fontFamily: 'Fredoka One', fontSize: '20px', fill: '#FFD700',
      stroke: '#7b2ff7', strokeThickness: 3
    }).setOrigin(1, 0);

    // Girl character beside launcher
    this.add.image(70, LAUNCHER_Y, 'game-girl').setScale(0.22);

    // Build grid
    this.grid = [];
    this.bubbleSprites = [];
    this.colorsInPlay = new Set();
    for (let r = 0; r < ROWS; r++) {
      this.grid[r] = [];
      this.bubbleSprites[r] = [];
      for (let c = 0; c < COLS; c++) {
        const color = Phaser.Utils.Array.GetRandom(COLORS);
        this.grid[r][c] = { color };
        this.colorsInPlay.add(color);
        const spr = this.add.image(colX(c), rowY(r), 'bubble-' + color);
        spr.setDisplaySize(BUBBLE_D - 4, BUBBLE_D - 4);
        this.bubbleSprites[r][c] = spr;
        this.totalBubbles++;
      }
    }

    // Column highlight zones (invisible, for input)
    this.columnZones = [];
    for (let c = 0; c < COLS; c++) {
      const zone = this.add.zone(colX(c), GAME_H / 2, BUBBLE_D, GAME_H).setInteractive({ useHandCursor: true });
      zone.colIndex = c;
      this.columnZones.push(zone);
      zone.on('pointerdown', () => this.shootBubble(c));
    }

    // Also allow clicking anywhere and mapping to nearest column
    this.input.on('pointerdown', (pointer) => {
      if (this.shooting) return;
      const c = Math.floor((pointer.x - GRID_X) / BUBBLE_D);
      if (c >= 0 && c < COLS) this.shootBubble(c);
    });

    // Launcher
    this.nextColor = this.pickNextColor();
    this.launcherBubble = this.add.image(GAME_W / 2, LAUNCHER_Y, 'bubble-' + this.nextColor);
    this.launcherBubble.setDisplaySize(BUBBLE_D, BUBBLE_D);

    // Launcher platform - simple drawn graphic
    const gfx = this.add.graphics();
    gfx.fillStyle(0x7b2ff7, 0.7);
    gfx.fillRoundedRect(GAME_W / 2 - 36, LAUNCHER_Y + 30, 72, 16, 8);

    // Launcher arrow indicator
    this.arrow = this.add.text(GAME_W / 2, LAUNCHER_Y - 38, '\u25B2', {
      fontFamily: 'Fredoka One', fontSize: '24px', fill: '#fff'
    }).setOrigin(0.5);
    this.tweens.add({
      targets: this.arrow, y: this.arrow.y - 8,
      duration: 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    // Instruction text
    this.instrText = this.add.text(GAME_W / 2, LAUNCHER_Y + 58, 'Tap a column to shoot!', {
      fontFamily: 'Fredoka One', fontSize: '16px', fill: '#ffcce0',
      stroke: '#7b2ff7', strokeThickness: 2
    }).setOrigin(0.5).setAlpha(0.8);
  }

  pickNextColor() {
    // Only pick from colors still on the board
    this.updateColorsInPlay();
    const available = [...this.colorsInPlay];
    if (available.length === 0) return Phaser.Utils.Array.GetRandom(COLORS);
    return Phaser.Utils.Array.GetRandom(available);
  }

  updateColorsInPlay() {
    this.colorsInPlay.clear();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (this.grid[r][c]) this.colorsInPlay.add(this.grid[r][c].color);
      }
    }
  }

  shootBubble(col) {
    if (this.shooting) return;

    // Find the lowest empty row in this column
    let targetRow = -1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (!this.grid[r][col]) { targetRow = r; break; }
    }
    if (targetRow === -1) return; // Column full

    this.shooting = true;
    const color = this.nextColor;

    // Hide instruction after first shot
    if (this.instrText.alpha > 0) {
      this.tweens.add({ targets: this.instrText, alpha: 0, duration: 300 });
    }

    // Animate bubble flying up
    const bullet = this.add.image(GAME_W / 2, LAUNCHER_Y, 'bubble-' + color);
    bullet.setDisplaySize(BUBBLE_D - 4, BUBBLE_D - 4);

    this.tweens.add({
      targets: bullet,
      x: colX(col),
      y: rowY(targetRow),
      duration: 250,
      ease: 'Quad.easeOut',
      onComplete: () => {
        bullet.destroy();
        this.placeBubble(targetRow, col, color);
      }
    });
  }

  placeBubble(row, col, color) {
    // Place in grid
    this.grid[row][col] = { color };
    const spr = this.add.image(colX(col), rowY(row), 'bubble-' + color);
    spr.setDisplaySize(BUBBLE_D - 4, BUBBLE_D - 4);
    this.bubbleSprites[row][col] = spr;
    this.totalBubbles++;

    // Quick scale-in
    spr.setScale(0);
    this.tweens.add({
      targets: spr,
      scaleX: (BUBBLE_D - 4) / spr.width,
      scaleY: (BUBBLE_D - 4) / spr.height,
      duration: 150, ease: 'Back.easeOut'
    });

    // Check for matches
    const cluster = findCluster(this.grid, row, col, color);
    if (cluster.length >= 3) {
      this.popCluster(cluster);
    } else {
      this.finishTurn();
    }
  }

  popCluster(cluster) {
    let delay = 0;
    for (const [r, c] of cluster) {
      const spr = this.bubbleSprites[r][c];
      if (spr) {
        this.time.delayedCall(delay, () => {
          this.popEffect(spr.x, spr.y, this.grid[r][c]?.color);
          this.tweens.add({
            targets: spr, scale: 0, alpha: 0, duration: 200,
            ease: 'Back.easeIn',
            onComplete: () => spr.destroy()
          });
        });
        delay += 40;
      }
      this.grid[r][c] = null;
      this.bubbleSprites[r][c] = null;
      this.totalBubbles--;
      this.popCount++;
    }

    // After popping, check for floating bubbles
    this.time.delayedCall(delay + 220, () => {
      this.popText.setText('Popped: ' + this.popCount);
      const floating = findFloating(this.grid);
      if (floating.length > 0) {
        this.dropFloating(floating);
      } else {
        this.checkWin();
      }
    });
  }

  dropFloating(cells) {
    let delay = 0;
    for (const [r, c] of cells) {
      const spr = this.bubbleSprites[r][c];
      if (spr) {
        this.time.delayedCall(delay, () => {
          this.tweens.add({
            targets: spr, y: GAME_H + 40, alpha: 0, duration: 500,
            ease: 'Quad.easeIn',
            onComplete: () => spr.destroy()
          });
        });
        delay += 60;
      }
      this.grid[r][c] = null;
      this.bubbleSprites[r][c] = null;
      this.totalBubbles--;
      this.popCount++;
    }

    this.time.delayedCall(delay + 520, () => {
      this.popText.setText('Popped: ' + this.popCount);
      this.checkWin();
    });
  }

  popEffect(x, y, color) {
    // Particle burst using small circles
    const tintMap = {
      blue: 0x4facfe, green: 0x38ef7d, orange: 0xffa726,
      pink: 0xf06292, red: 0xef5350, yellow: 0xffee58
    };
    const tint = tintMap[color] || 0xffffff;
    for (let i = 0; i < 8; i++) {
      const p = this.add.circle(x, y, Phaser.Math.Between(3, 6), tint);
      const angle = (i / 8) * Math.PI * 2;
      const dist = Phaser.Math.Between(30, 60);
      this.tweens.add({
        targets: p,
        x: x + Math.cos(angle) * dist,
        y: y + Math.sin(angle) * dist,
        alpha: 0, scale: 0,
        duration: 400, ease: 'Quad.easeOut',
        onComplete: () => p.destroy()
      });
    }

    // Star burst
    const star = this.add.text(x, y, '\u2B50', { fontSize: '28px' }).setOrigin(0.5);
    this.tweens.add({
      targets: star, y: y - 40, alpha: 0, scale: 1.5,
      duration: 500, ease: 'Quad.easeOut',
      onComplete: () => star.destroy()
    });
  }

  checkWin() {
    // Count remaining bubbles
    let remaining = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (this.grid[r][c]) remaining++;
      }
    }

    if (remaining === 0) {
      this.time.delayedCall(300, () => this.scene.start('WinScene', { pops: this.popCount }));
    } else {
      this.finishTurn();
    }
  }

  finishTurn() {
    this.nextColor = this.pickNextColor();
    this.launcherBubble.setTexture('bubble-' + this.nextColor);
    this.shooting = false;
  }
}

// ── WinScene ─────────────────────────────────────────────────────────────────

class WinScene extends Phaser.Scene {
  constructor() { super({ key: 'WinScene' }); }

  create(data) {
    const bg = this.add.image(GAME_W / 2, GAME_H / 2, 'bg');
    bg.setDisplaySize(GAME_W, GAME_H);

    // Confetti
    for (let i = 0; i < 60; i++) {
      const colors = [0xf06292, 0x7b2ff7, 0xffee58, 0x4facfe, 0x38ef7d, 0xffa726];
      const c = this.add.rectangle(
        Phaser.Math.Between(0, GAME_W),
        Phaser.Math.Between(-100, -10),
        Phaser.Math.Between(6, 12),
        Phaser.Math.Between(10, 20),
        Phaser.Utils.Array.GetRandom(colors)
      ).setAlpha(0.9);
      this.tweens.add({
        targets: c,
        y: GAME_H + 40,
        x: c.x + Phaser.Math.Between(-80, 80),
        angle: Phaser.Math.Between(-360, 360),
        duration: Phaser.Math.Between(2000, 4000),
        repeat: -1,
        delay: Phaser.Math.Between(0, 2000)
      });
    }

    // Level completed banner
    this.add.image(GAME_W / 2, 130, 'level-done').setScale(0.5);

    // Stars
    const starY = 200;
    for (let i = 0; i < 3; i++) {
      const s = this.add.image(GAME_W / 2 - 50 + i * 50, starY, 'star-yellow').setScale(0).setDepth(1);
      this.tweens.add({
        targets: s, scale: 1.8, duration: 400,
        ease: 'Back.easeOut', delay: 300 + i * 200
      });
    }

    // Cat celebration
    this.add.image(GAME_W / 2, 340, 'cat-win').setScale(0.35);

    // Winning text
    const winText = this.add.text(GAME_W / 2, 470, "You popped them all, Kaylee!", {
      fontFamily: 'Fredoka One', fontSize: '26px', fill: '#FFD700',
      stroke: '#7b2ff7', strokeThickness: 4, align: 'center'
    }).setOrigin(0.5);
    this.tweens.add({
      targets: winText, scale: 1.05,
      duration: 800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    // Pop count
    this.add.text(GAME_W / 2, 520, 'Bubbles popped: ' + (data.pops || 0), {
      fontFamily: 'Fredoka One', fontSize: '20px', fill: '#fff',
      stroke: '#7b2ff7', strokeThickness: 3
    }).setOrigin(0.5);

    // Replay button
    const replayBtn = this.add.image(GAME_W / 2, 590, 'btn-replay').setScale(0.55).setInteractive({ useHandCursor: true });
    replayBtn.on('pointerover', () => replayBtn.setScale(0.6));
    replayBtn.on('pointerout', () => replayBtn.setScale(0.55));
    replayBtn.on('pointerdown', () => this.scene.start('GameScene'));

    // Back button
    const backBtn = this.add.text(16, 16, '\u{1F3E0} Games', {
      fontFamily: 'Fredoka One', fontSize: '22px', fill: '#fff',
      stroke: '#7b2ff7', strokeThickness: 3
    }).setInteractive({ useHandCursor: true });
    backBtn.on('pointerdown', () => { window.location.href = '../../index.html'; });
  }
}

// ── Game Config ──────────────────────────────────────────────────────────────

const config = {
  type: Phaser.AUTO,
  width: GAME_W,
  height: GAME_H,
  backgroundColor: '#1a0533',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [MenuScene, GameScene, WinScene]
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
