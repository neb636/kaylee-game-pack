<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animal Parade — Kaylee's Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a0033; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    #home-btn {
      position: fixed; top: 14px; left: 14px; z-index: 100;
      background: #ff6eb4; color: #fff; border: none; border-radius: 50px;
      padding: 10px 20px; font-family: 'Fredoka One', cursive; font-size: 20px;
      cursor: pointer; box-shadow: 0 4px 0 #c0006b; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    #home-btn:hover { background: #ff4aa0; transform: translateY(-2px); }
    #home-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c0006b; }
  </style>
</head>
<body>
<a id="home-btn" href="/index.html">🏠 Games</a>
<script src="/lib/phaser.min.js"></script>
<script>
'use strict';

/* ─── Constants ─────────────────────────────────────────── */
const PACK  = '../../packs/urban-animals-sprite-sheet-pixel-art-pack';
const W = 800, H = 600;
const ANIMAL_SCALE = 1.5;          // displayed sprite size: 192×192
const ANIMAL_Y     = 435;          // animal centre Y (on the parade road)
const SPOT_X       = 400;          // spotlight centre X
const SPOT_Y       = 435;          // spotlight centre Y
const SPOT_R       = 108;          // spotlight radius (px)
const SPOT_HIT_TOL = 50;           // extra tolerance for hit detection
const WIN_SCORE    = 20;
const INIT_SPEED   = 120;          // px / second
const SPEED_STEP   = 25;           // added every 5 stars
const MAX_SPEED    = 280;

/* ─── Animal definitions ────────────────────────────────── */
// Sprites are 128×128 frames; some assets use "Jamp" instead of "Jump"
const ANIMALS = [
  { id: 1, name: 'Pup',   walkFrames: 11, specialFrames:  4 },
  { id: 2, name: 'Boar',  walkFrames: 10, specialFrames: 12 },
  { id: 3, name: 'Mouse', walkFrames:  8, specialFrames: 13 },
  { id: 4, name: 'Bunny', walkFrames: 11, specialFrames:  4 },
  { id: 5, name: 'Fox',   walkFrames: 10, specialFrames: 12 },
  { id: 6, name: 'Goat',  walkFrames:  8, specialFrames: 13 },
];

/* ══════════════════════════════════════════════════════════
   BootScene — load assets & register animations globally
   ══════════════════════════════════════════════════════════ */
class BootScene extends Phaser.Scene {
  constructor() { super('BootScene'); }

  preload() {
    // Loading bar
    const barBg = this.add.graphics();
    barBg.fillStyle(0x330055, 1);
    barBg.fillRoundedRect(W/2 - 201, H/2 - 21, 402, 42, 21);

    const bar = this.add.graphics();
    this.load.on('progress', v => {
      bar.clear();
      bar.fillStyle(0xFF6EB4, 1);
      bar.fillRoundedRect(W/2 - 198, H/2 - 18, 396 * v, 36, 18);
    });

    this.add.text(W/2, H/2 - 55, '🎪 Loading the Parade…', {
      fontFamily: 'Fredoka One', fontSize: '30px',
      fill: '#FFD700', stroke: '#4a0080', strokeThickness: 4
    }).setOrigin(0.5);

    // Load Walk & Special for all 6 animals
    ANIMALS.forEach(a => {
      const dir = `${PACK}/Animal_${a.id}`;
      this.load.spritesheet(`walk_${a.id}`,    `${dir}/Walk.png`,    { frameWidth: 128, frameHeight: 128 });
      this.load.spritesheet(`special_${a.id}`, `${dir}/Special.png`, { frameWidth: 128, frameHeight: 128 });
    });
  }

  create() {
    ANIMALS.forEach(a => {
      this.anims.create({
        key: `walk_${a.id}`,
        frames: this.anims.generateFrameNumbers(`walk_${a.id}`, { start: 0, end: a.walkFrames - 1 }),
        frameRate: 12, repeat: -1
      });
      this.anims.create({
        key: `special_${a.id}`,
        frames: this.anims.generateFrameNumbers(`special_${a.id}`, { start: 0, end: a.specialFrames - 1 }),
        frameRate: 10, repeat: 0
      });
    });
    this.scene.start('GameScene');
  }
}

/* ══════════════════════════════════════════════════════════
   GameScene
   ══════════════════════════════════════════════════════════ */
class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  /* ── lifecycle ─────────────────────────────────────────── */
  create() {
    this.score          = 0;
    this.speed          = INIT_SPEED;
    this.tapsThisWave   = 0;
    this.wave           = 1;
    this.won            = false;
    this.activeAnimal   = null;
    this.spawnScheduled = false;

    this.buildBackground();
    this.buildSpotlight();
    this.buildUI();

    this.input.on('pointerdown', ptr => this.onTap(ptr.x, ptr.y));

    // Spawn first animal shortly after scene opens
    this.scheduleSpawn(700);
  }

  update(time, delta) {
    const dt = delta / 1000;
    const t  = time  / 1000;

    // Move active animal
    const a = this.activeAnimal;
    if (a && a.active) {
      a.x += a.walkVx * dt;
      a.inSpot = Phaser.Math.Distance.Between(a.x, a.y, SPOT_X, SPOT_Y) < SPOT_R + SPOT_HIT_TOL;

      if (a.x < -220) {          // animal walked off screen
        a.destroy();
        this.activeAnimal = null;
      }
    }

    // Spotlight animation
    const animalInSpot = this.activeAnimal && this.activeAnimal.active && this.activeAnimal.inSpot;
    if (animalInSpot) {
      this.renderSpotActive(t);
    } else {
      this.renderSpotIdle(t);
    }

    // Hint text gentle pulse
    this.hintText.setAlpha(0.75 + 0.25 * Math.sin(t * 3.5));

    // Auto-spawn next animal when none is active
    if (!this.activeAnimal && !this.spawnScheduled && !this.won) {
      this.scheduleSpawn(450);
    }
  }

  /* ── background ────────────────────────────────────────── */
  buildBackground() {
    const g = this.add.graphics().setDepth(0);

    // Sky gradient bands
    const bands = [
      [0, 0x87CEEB], [100, 0x93D5EE], [200, 0x9FDBEC],
      [300, 0xABE1EA], [400, 0x4CAF50]
    ];
    for (let i = 0; i < bands.length - 1; i++) {
      const [y0, c0] = bands[i];
      const [y1]     = bands[i + 1];
      g.fillStyle(c0, 1);
      g.fillRect(0, y0, W, y1 - y0);
    }

    // Green ground
    g.fillStyle(0x4CAF50, 1); g.fillRect(0, 400, W, 200);
    g.fillStyle(0x388E3C, 1); g.fillRect(0, 400, W, 18);

    // Parade road (tan strip)
    g.fillStyle(0xD4A843, 1); g.fillRect(0, 418, W, 120);
    g.fillStyle(0xBF9430, 1); g.fillRect(0, 418, W, 4);
    g.fillStyle(0xBF9430, 1); g.fillRect(0, 534, W, 4);

    // White dashes on road
    g.fillStyle(0xFFFFFF, 0.45);
    for (let x = 0; x < W; x += 80) {
      g.fillRect(x + 4, 471, 52, 5);
    }

    // Clouds
    g.fillStyle(0xFFFFFF, 0.88);
    [[120, 85, 46], [330, 65, 38], [590, 95, 52], [755, 75, 34]].forEach(([cx, cy, r]) => {
      g.fillCircle(cx, cy, r);
      g.fillCircle(cx + r * 0.8, cy - 6, r * 0.72);
      g.fillCircle(cx + r * 1.55, cy, r * 0.78);
    });

    // Background crowd silhouettes (rows of little people)
    const crowdColors = [0xFF6EB4, 0x9B59B6, 0x3498DB, 0xFFD700, 0xFF6347];
    for (let row = 0; row < 3; row++) {
      const baseY = 285 + row * 28;
      for (let x = 18 + row * 22; x < W; x += 58) {
        const c = crowdColors[(x + row * 3) % crowdColors.length];
        g.fillStyle(c, 0.35 - row * 0.06);
        g.fillCircle(x, baseY, 14);
        g.fillRect(x - 6, baseY + 12, 12, 26);
      }
    }

    // ── Banner row 1 ──
    const flagPal = [0xFF6EB4, 0xFFD700, 0x9B59B6, 0xFF6347, 0x3498DB, 0x2ECC71, 0xFFFFFF];
    g.lineStyle(3, 0x44006B, 1);
    g.beginPath(); g.moveTo(-4, 52); g.lineTo(W + 4, 52); g.strokePath();
    for (let i = 0; i < 24; i++) {
      g.fillStyle(flagPal[i % flagPal.length], 1);
      g.fillTriangle(i * 36, 52, i * 36 + 26, 52, i * 36 + 13, 90);
    }

    // ── Banner row 2 ──
    g.lineStyle(2, 0x44006B, 0.7);
    g.beginPath(); g.moveTo(-4, 112); g.lineTo(W + 4, 112); g.strokePath();
    for (let i = 0; i < 24; i++) {
      g.fillStyle(flagPal[(i + 3) % flagPal.length], 0.82);
      g.fillTriangle(i * 36 + 18, 112, i * 36 + 44, 112, i * 36 + 31, 146);
    }

    // Festive balloons
    const bColors = [0xFF6EB4, 0xFFD700, 0x9B59B6, 0x3498DB];
    [[80, 230], [210, 210], [420, 240], [560, 220], [700, 235]].forEach(([bx, by], i) => {
      const c = bColors[i % bColors.length];
      g.fillStyle(c, 0.75);
      g.fillEllipse(bx, by, 28, 36);
      g.fillStyle(c, 0.6);
      g.fillTriangle(bx - 4, by + 18, bx + 4, by + 18, bx, by + 25);
      g.lineStyle(1, 0x333333, 0.5);
      g.strokePath();
      // String
      g.lineStyle(1, 0x555555, 0.6);
      g.beginPath(); g.moveTo(bx, by + 25); g.lineTo(bx + 5, by + 55); g.strokePath();
    });
  }

  /* ── spotlight ─────────────────────────────────────────── */
  buildSpotlight() {
    this.spotGlow = this.add.graphics().setDepth(2);
    this.spotRing = this.add.graphics().setDepth(4);

    this.renderSpotIdle(0);

    this.hintText = this.add.text(SPOT_X, SPOT_Y - SPOT_R - 14, '✨ TAP HERE! ✨', {
      fontFamily: 'Fredoka One', fontSize: '22px',
      fill: '#FFD700', stroke: '#4a0080', strokeThickness: 3
    }).setOrigin(0.5, 1).setDepth(5);
  }

  renderSpotIdle(t) {
    const drift = 0.08 + 0.05 * Math.sin(t * 1.5);  // gentle glow breathe

    this.spotGlow.clear();
    this.spotGlow.fillStyle(0xFFFF88, drift * 0.6);
    this.spotGlow.fillEllipse(SPOT_X, SPOT_Y, (SPOT_R + 40) * 2, (SPOT_R + 20) * 1.3);
    this.spotGlow.fillStyle(0xFFFFAA, drift + 0.08);
    this.spotGlow.fillEllipse(SPOT_X, SPOT_Y, SPOT_R * 2, SPOT_R * 1.2);

    this.spotRing.clear();
    this.spotRing.lineStyle(5, 0xFFD700, 0.9);
    this.spotRing.strokeEllipse(SPOT_X, SPOT_Y, SPOT_R * 2, SPOT_R * 1.2);
    this.spotRing.lineStyle(2, 0xFFFFFF, 0.45);
    this.spotRing.strokeEllipse(SPOT_X, SPOT_Y, (SPOT_R - 9) * 2, (SPOT_R - 9) * 1.2);
  }

  renderSpotActive(t) {
    // Bright pulsing spotlight when animal is inside
    const pulse = 0.65 + 0.35 * Math.sin(t * 9);
    const expand = (1 - pulse) * 14;

    this.spotGlow.clear();
    this.spotGlow.fillStyle(0xFFFF88, 0.3);
    this.spotGlow.fillEllipse(SPOT_X, SPOT_Y, (SPOT_R + 50) * 2, (SPOT_R + 30) * 1.3);
    this.spotGlow.fillStyle(0xFFFFCC, 0.38);
    this.spotGlow.fillEllipse(SPOT_X, SPOT_Y, SPOT_R * 2 + expand, SPOT_R * 1.3 + expand);

    this.spotRing.clear();
    this.spotRing.lineStyle(8, 0xFFFFFF, pulse);
    this.spotRing.strokeEllipse(SPOT_X, SPOT_Y, (SPOT_R + expand * 0.5) * 2, (SPOT_R + expand * 0.3) * 1.2);
    this.spotRing.lineStyle(4, 0xFFD700, 1);
    this.spotRing.strokeEllipse(SPOT_X, SPOT_Y, SPOT_R * 2, SPOT_R * 1.2);
  }

  /* ── UI ────────────────────────────────────────────────── */
  buildUI() {
    const bg = this.add.graphics().setDepth(8);
    bg.fillStyle(0x44006B, 0.75);
    bg.fillRoundedRect(W - 186, 8, 178, 50, 25);
    bg.fillStyle(0x44006B, 0.75);
    bg.fillRoundedRect(8, 8, 130, 44, 22);

    this.scoreText = this.add.text(W - 97, 33, '⭐ 0 / 20', {
      fontFamily: 'Fredoka One', fontSize: '26px',
      fill: '#FFD700', stroke: '#4a0080', strokeThickness: 3
    }).setOrigin(0.5).setDepth(9);

    this.waveText = this.add.text(73, 30, 'Wave 1 🌟', {
      fontFamily: 'Fredoka One', fontSize: '18px',
      fill: '#FF6EB4', stroke: '#4a0080', strokeThickness: 2
    }).setOrigin(0.5).setDepth(9);
  }

  /* ── spawning ──────────────────────────────────────────── */
  scheduleSpawn(delay) {
    if (this.spawnScheduled || this.won) return;
    this.spawnScheduled = true;
    this.time.delayedCall(delay, () => {
      this.spawnScheduled = false;
      this.spawnAnimal();
    });
  }

  spawnAnimal() {
    if (this.won || (this.activeAnimal && this.activeAnimal.active)) return;

    const a = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];

    const sprite = this.add.sprite(920, ANIMAL_Y, `walk_${a.id}`, 0);
    sprite.setScale(ANIMAL_SCALE);
    sprite.setFlipX(true);         // face left to walk left
    sprite.setDepth(3);
    sprite.play(`walk_${a.id}`);

    sprite.animalData   = a;
    sprite.isDoingSpecial = false;
    sprite.walkVx       = -this.speed;
    sprite.inSpot       = false;

    this.activeAnimal = sprite;

    // Show animal name badge when it enters the scene
    this.time.delayedCall(200, () => {
      if (!sprite.active) return;
      const badge = this.add.text(920, ANIMAL_Y - 115, a.name + '!', {
        fontFamily: 'Fredoka One', fontSize: '22px',
        fill: '#FFFFFF', stroke: '#4a0080', strokeThickness: 3
      }).setOrigin(0.5).setDepth(9);
      badge.walkVx = -this.speed;
      // Tie badge movement to a simple timer
      const moveTimer = this.time.addEvent({
        delay: 16, repeat: 60,
        callback: () => { if (badge.active) badge.x += badge.walkVx * 0.016; }
      });
      this.time.delayedCall(1200, () => {
        this.tweens.add({ targets: badge, alpha: 0, duration: 400, onComplete: () => badge.destroy() });
      });
    });
  }

  /* ── input ─────────────────────────────────────────────── */
  onTap(x, y) {
    if (this.won) return;

    const a = this.activeAnimal;
    if (!a || !a.active || a.isDoingSpecial) {
      this.showMissEffect();
      return;
    }

    const dist = Phaser.Math.Distance.Between(a.x, a.y, SPOT_X, SPOT_Y);
    if (dist < SPOT_R + SPOT_HIT_TOL) {
      this.doHit(a);
    } else {
      this.showMissEffect();
    }
  }

  doHit(animal) {
    animal.isDoingSpecial = true;
    animal.walkVx = 0;

    // Snap to spotlight centre
    this.tweens.add({ targets: animal, x: SPOT_X, duration: 90, ease: 'Power1' });

    animal.play(`special_${animal.animalData.id}`);

    this.burstStars(SPOT_X, SPOT_Y);
    this.flashHit();

    // Score
    this.score++;
    this.scoreText.setText(`⭐ ${this.score} / 20`);
    this.tweens.add({ targets: this.scoreText, scaleX: 1.35, scaleY: 1.35, duration: 120, yoyo: true });

    // Score pop-up
    const pop = this.add.text(SPOT_X, SPOT_Y - 55, '+1 ⭐', {
      fontFamily: 'Fredoka One', fontSize: '38px',
      fill: '#FFD700', stroke: '#4a0080', strokeThickness: 5
    }).setOrigin(0.5).setDepth(10);
    this.tweens.add({ targets: pop, y: SPOT_Y - 145, alpha: 0, duration: 950, ease: 'Power2',
      onComplete: () => pop.destroy() });

    // Wave speed-up every 5 stars
    this.tapsThisWave++;
    if (this.tapsThisWave >= 5) {
      this.tapsThisWave = 0;
      this.wave++;
      this.speed = Math.min(INIT_SPEED + (this.wave - 1) * SPEED_STEP, MAX_SPEED);
      this.waveText.setText(`Wave ${this.wave} 🌟`);
      this.tweens.add({ targets: this.waveText, scaleX: 1.5, scaleY: 1.5, duration: 200, yoyo: true });
    }

    // Win check
    if (this.score >= WIN_SCORE) {
      this.won = true;
      this.time.delayedCall(2200, () => this.scene.start('WinScene'));
      return;
    }

    // After special animation: resume walking, then spawn next
    animal.once('animationcomplete', () => {
      if (!animal.active) return;
      animal.isDoingSpecial = false;
      animal.walkVx = -this.speed;
      animal.play(`walk_${animal.animalData.id}`);
    });
  }

  showMissEffect() {
    // Wobble the hint text
    this.tweens.add({
      targets: this.hintText, x: SPOT_X + 6, duration: 55,
      yoyo: true, repeat: 3, onComplete: () => this.hintText.setX(SPOT_X)
    });

    // Brief dim red tint on ring
    const miss = this.add.graphics().setDepth(4);
    miss.lineStyle(5, 0xFF6666, 0.7);
    miss.strokeEllipse(SPOT_X, SPOT_Y, SPOT_R * 2, SPOT_R * 1.2);
    this.tweens.add({ targets: miss, alpha: 0, duration: 280,
      onComplete: () => miss.destroy() });
  }

  /* ── effects ───────────────────────────────────────────── */
  flashHit() {
    const flash = this.add.graphics().setDepth(6);
    flash.fillStyle(0xFFFFFF, 0.55);
    flash.fillEllipse(SPOT_X, SPOT_Y, (SPOT_R + 20) * 2, (SPOT_R + 10) * 1.3);
    this.tweens.add({ targets: flash, alpha: 0, scaleX: 1.9, scaleY: 1.9, duration: 520,
      onComplete: () => flash.destroy() });
  }

  burstStars(cx, cy) {
    const emojis = ['⭐', '✨', '💫', '🌟'];
    for (let i = 0; i < 14; i++) {
      const angle = (i / 14) * Math.PI * 2;
      const r     = 70 + Math.random() * 65;
      const em    = emojis[Math.floor(Math.random() * emojis.length)];
      const star  = this.add.text(cx, cy, em, {
        fontSize: `${18 + Math.floor(Math.random() * 16)}px`
      }).setOrigin(0.5).setDepth(7);
      this.tweens.add({
        targets: star,
        x: cx + Math.cos(angle) * r,
        y: cy + Math.sin(angle) * r - 18,
        alpha: 0, scale: 0.15,
        duration: 650 + Math.random() * 350,
        ease: 'Power2',
        onComplete: () => star.destroy()
      });
    }
  }
}

/* ══════════════════════════════════════════════════════════
   WinScene
   ══════════════════════════════════════════════════════════ */
class WinScene extends Phaser.Scene {
  constructor() { super('WinScene'); }

  create() {
    // Deep purple background
    const g = this.add.graphics();
    g.fillStyle(0x1A0033, 1);
    g.fillRect(0, 0, W, H);

    // Gradient arcs for festivity
    g.fillStyle(0xFF6EB4, 0.12);
    g.fillCircle(W / 2, H / 2, 380);
    g.fillStyle(0x9B59B6, 0.12);
    g.fillCircle(W / 2, H / 2, 280);

    // Banner at top
    const flagPal = [0xFF6EB4, 0xFFD700, 0x9B59B6, 0xFF6347, 0x3498DB, 0x2ECC71];
    g.lineStyle(2, 0x9B59B6, 0.7);
    g.beginPath(); g.moveTo(0, 30); g.lineTo(W, 30); g.strokePath();
    for (let i = 0; i < 22; i++) {
      g.fillStyle(flagPal[i % flagPal.length], 1);
      g.fillTriangle(i * 38, 30, i * 38 + 26, 30, i * 38 + 13, 65);
    }

    // All 6 animals doing Special, scale 1.0 (128px each)
    const posX = [65, 195, 328, 468, 600, 730];
    ANIMALS.forEach((a, i) => {
      const spr = this.add.sprite(posX[i], 470, `special_${a.id}`, 0);
      spr.setScale(1.0);
      spr.setFlipX(i % 2 !== 0);
      spr.play(`special_${a.id}`);
      spr.on('animationcomplete', () => spr.play(`special_${a.id}`));

      // Gentle bob
      this.tweens.add({ targets: spr, y: 458, duration: 550 + i * 80, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    });

    // Celebration text
    this.add.text(W / 2, 95, '🎉 What a party,', {
      fontFamily: 'Fredoka One', fontSize: '50px',
      fill: '#FFD700', stroke: '#4a0080', strokeThickness: 7
    }).setOrigin(0.5);

    this.add.text(W / 2, 170, 'Kaylee! 🎊', {
      fontFamily: 'Fredoka One', fontSize: '60px',
      fill: '#FF6EB4', stroke: '#4a0080', strokeThickness: 7
    }).setOrigin(0.5);

    this.add.text(W / 2, 248, '⭐  You scored 20 stars!  ⭐', {
      fontFamily: 'Fredoka One', fontSize: '28px',
      fill: '#FFFFFF', stroke: '#4a0080', strokeThickness: 4
    }).setOrigin(0.5);

    this.add.text(W / 2, 298, 'The animals loved dancing for you! 🐾', {
      fontFamily: 'Fredoka One', fontSize: '22px',
      fill: '#FF6EB4', stroke: '#4a0080', strokeThickness: 3
    }).setOrigin(0.5);

    // Play Again button
    const btn = this.add.text(W / 2, 545, '  🎮  Play Again!  🎮  ', {
      fontFamily: 'Fredoka One', fontSize: '30px',
      fill: '#FFFFFF', stroke: '#4a0080', strokeThickness: 4,
      backgroundColor: '#FF6EB4', padding: { x: 22, y: 12 }
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });

    btn.on('pointerover', () => btn.setStyle({ backgroundColor: '#9B59B6' }));
    btn.on('pointerout',  () => btn.setStyle({ backgroundColor: '#FF6EB4' }));
    btn.on('pointerdown', () => this.scene.start('GameScene'));

    this.tweens.add({ targets: btn, scaleX: 1.06, scaleY: 1.06, duration: 620, yoyo: true, repeat: -1 });

    // Confetti data
    const confettiColors = [0xFF6EB4, 0xFFD700, 0xFF6347, 0x9B59B6, 0x3498DB, 0x2ECC71, 0xFFFFFF];
    this.confetti = Array.from({ length: 70 }, (_, i) => ({
      x: Math.random() * W,
      y: Math.random() * H - H,
      vx: (Math.random() - 0.5) * 55,
      vy: 75 + Math.random() * 110,
      rot: Math.random() * Math.PI * 2,
      rs: (Math.random() - 0.5) * 4.5,
      w: 7 + Math.random() * 9,
      h: 4 + Math.random() * 5,
      color: confettiColors[i % confettiColors.length]
    }));
    this.confettiG = this.add.graphics().setDepth(20);
  }

  update(time, delta) {
    const dt = delta / 1000;
    this.confettiG.clear();
    this.confetti.forEach(c => {
      c.x  += c.vx * dt;
      c.y  += c.vy * dt;
      c.rot += c.rs * dt;
      if (c.y > H + 16) { c.y = -16; c.x = Math.random() * W; }
      if (c.x < -16)    { c.x = W + 16; }
      if (c.x > W + 16) { c.x = -16; }
      this.confettiG.fillStyle(c.color, 1);
      // Simulate rotation with alternating width
      const rw = Math.abs(Math.cos(c.rot)) * c.w;
      this.confettiG.fillRect(c.x - rw / 2, c.y - c.h / 2, rw, c.h);
    });
  }
}

   Phaser config & launch
   ══════════════════════════════════════════════════════════ */
new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  backgroundColor: '#1a0033',
  scene: [BootScene, GameScene, WinScene],
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  }
});
</script>
