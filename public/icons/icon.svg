<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#e91e8c"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="108" ry="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  <!-- Crown above the K -->
  <g transform="translate(256, 110)" text-anchor="middle">
    <text font-size="80" fill="#ffd700" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))">👑</text>
  </g>
  <!-- Sparkle top-left -->
  <g transform="translate(90, 120)">
    <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="white" opacity="0.8"/>
  </g>
  <!-- Sparkle top-right -->
  <g transform="translate(420, 100)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="white" opacity="0.6"/>
  </g>
  <!-- Sparkle bottom-left -->
  <g transform="translate(100, 410)">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="white" opacity="0.5"/>
  </g>
  <!-- Sparkle bottom-right -->
  <g transform="translate(410, 380)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="white" opacity="0.7"/>
  </g>
  <!-- Letter K -->
  <text x="256" y="360" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="260" fill="url(#letter)" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.35))">K</text>
</svg>
